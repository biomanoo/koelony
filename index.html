const appBase=()=>location.origin+location.pathname;
const cageUrl=c=>appBase()+'#cage='+encodeURIComponent(c.label);
function qrDataURL(text){const q=qrcode(0,'M');q.addData(text);q.make();return q.createDataURL(4,0)}
async function cageQR(id){const c=byId('cages',id);try{await loadQR()}catch(e){toast(e.message,true);return}
  openModal(`<div class="mh"><h3>QR code · ${esc(c.label)}</h3><button class="x" onclick="closeModal()">×</button></div><div class="qrbox"><img class="qr" src="${qrDataURL(cageUrl(c))}" alt="QR code for cage ${esc(c.label)}"><p class="mute" style="word-break:break-all;font-size:12.5px">${esc(cageUrl(c))}</p><p>Scan it with the phone camera (or the in-app scanner) to open this cage.</p><button class="btn pri" onclick="printCards(['${id}'])">Print cage card with QR</button></div>`)}

  if(c)cageDetail(c.id);else toast(`Cage ${lbl} was not found`,true)}

let SCAN=null,JQP=null;
function loadJsQR(){if(window.jsQR)return Promise.resolve();if(JQP)return JQP;JQP=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';s.onload=res;s.onerror=()=>{JQP=null;rej(new Error('Could not load the scanner'))};document.head.appendChild(s)});return JQP}
function manualCage(){return `<div class="fld" style="margin-top:12px"><span>…or type a cage ID</span><input list="cgl" id="mcg" placeholder="e.g. A0013D-4F" onchange="const v=this.value;stopScan();closeModal();openCageByLabel(v)"><datalist id="cgl">${S.cages.map(c=>`<option value="${esc(c.label)}">`).join('')}</datalist></div>`}
async function scanCage(){
  if(!navigator.mediaDevices?.getUserMedia||!window.isSecureContext){openModal(`<div class="mh"><h3>Scan a cage card</h3><button class="x" onclick="closeModal()">×</button></div><p>Point your phone's <b>Camera app</b> at the QR code on the cage card — it opens that cage here directly.</p><p class="mute" style="font-size:12.5px">Scanning inside the app needs the site on https:// (turn on the free SSL certificate in InfinityFree).</p>${manualCage()}`);return}
  openModal(`<div class="mh"><h3>Scan a cage card</h3><button class="x" onclick="closeModal()">×</button></div><video id="scanv" playsinline muted></video><p class="mute" id="scanMsg">Point the camera at the QR code on the card…</p>${manualCage()}`);
  try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});const v=$('#scanv');if(!v){st.getTracks().forEach(t=>t.stop());return}
    v.srcObject=st;await v.play();SCAN={st};let det=null;
    if('BarcodeDetector' in window){try{det=new BarcodeDetector({formats:['qr_code']})}catch(e){}}if(!det)await loadJsQR();
    const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
    const tick=async()=>{if(!SCAN)return;let txt=null;
      try{if(det){const r=await det.detect(v);if(r&&r[0])txt=r[0].rawValue}else if(v.videoWidth){const sc=Math.min(1,640/v.videoWidth);cv.width=v.videoWidth*sc;cv.height=v.videoHeight*sc;cx.drawImage(v,0,0,cv.width,cv.height);const im=cx.getImageData(0,0,cv.width,cv.height);const r=jsQR(im.data,im.width,im.height);if(r)txt=r.data}}catch(e){}
      if(txt){gotScan(txt);return}setTimeout(tick,200)};tick()}
  catch(e){const m=$('#scanMsg');if(m)m.textContent='Camera not available ('+e.message+'). Use the phone camera app, or type the cage ID below.'}}
function stopScan(){if(SCAN){SCAN.st.getTracks().forEach(t=>t.stop());SCAN=null}}
function gotScan(txt){stopScan();closeModal();if(navigator.vibrate)navigator.vibrate(60);const m=String(txt).match(/#cage=([^&\s]+)/);openCageByLabel(m?decodeURIComponent(m[1]):String(txt).trim())}

const hex2rgb=h=>{h=String(h||'#868e96').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return [n>>16&255,n>>8&255,n&255]};

  <div class="tw"><table class="tbl"><thead><tr><th>Strain</th><th>Breeder</th><th>Offspring</th></tr></thead><tbody>${L.map(x=>`<tr onclick="closeModal();strainForm('${x.id}')"><td><b>${esc(x.name)}</b></td><td><span class="chip" style="background:${darkOf(x)};color:${inkOn(darkOf(x))};min-width:90px;text-align:center">BREEDER</span></td><td><span class="chip" style="background:${lightOf(x)};color:${inkOn(lightOf(x))};min-width:90px;text-align:center">offspring</span></td></tr>`).join('')}</tbody></table></div>

function cardStrain(c,b){if(b)return byId('strains',b.strain);const ms=liveIn(c.id);const cnt={};ms.forEach(m=>cnt[m.strain]=(cnt[m.strain]||0)+1);const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];return top?byId('strains',top[0]):null}

const noGenoStrain=sid=>{const st=byId('strains',sid);return !!(st&&st.noGeno)};

function cardIssues(c){const out=[],add=(w,ok)=>{if(!ok)out.push(w)};const b=breedingIn(c.id);const bad=g=>!g||g==='Pending';
  if(b){const M=byId('mice',b.male),F=(b.females||[]).map(i=>byId('mice',i)).filter(Boolean);
    add('strain',b.strain&&byId('strains',b.strain));add('ASAF',asafOf(c,b));add('♂ breeder',M);add('♀ breeder',F.length);
    if(M){add('♂ DOB',M.dob);add('♂ genotype',!bad(effGeno(M)))}
    if(F.length){add('♀ DOB',F.every(f=>f.dob));add('♀ genotype',F.every(f=>!bad(effGeno(f))))}
    add('mating date',b.setup||c.mating);add('source',srcOf(c));return out}
  const ms=liveIn(c.id);if(!ms.length)return out;
  add('strain',ms.every(m=>m.strain&&byId('strains',m.strain)));add('ASAF',asafOf(c));add('sex',ms.every(m=>m.sex==='F'||m.sex==='M'));
  add('DOB',ms.every(m=>m.dob));add('genotype',ms.every(m=>!bad(effGeno(m))));add('owner',c.owner||ms.some(m=>m.owner));
  add('generation',ms.some(m=>m.generation));add('source',srcOf(c));add('dam',ms.some(m=>parentText(m,'dam')));add('sire',ms.some(m=>parentText(m,'sire')));return out}

/* ---------- smart fill: infer missing data from what is already recorded (reviewed before saving) ---------- */
const GEST=21;
function inferFixes(){const P=[],add=(c,id,k,v,label,why)=>{if(v===''||v==null)return;P.push({c,id,k,v,label,why})};
  const mice=S.mice.filter(isLive);
  // 1. breedings: mating date from first litter
  for(const b of S.breedings){if(b.setup)continue;const L=S.litters.filter(l=>l.breeding===b.id&&l.dob).sort((x,y)=>natCmp(x.dob,y.dob));
    const cg=b.cage&&byId('cages',b.cage);
    if(L.length)add('breedings',b.id,'setup',addDays(L[0].dob,-GEST),`Breeding ${b.name}: mating date`,`${GEST} days before first litter (${fmtDate(L[0].dob)})`);
    else if(cg&&cg.mating)add('breedings',b.id,'setup',cg.mating,`Breeding ${b.name}: mating date`,'from its cage');}
  // 2. litters: pups born from weaned counts
  for(const l of S.litters){if(!(+l.born)&&l.weaned&&((+l.weanedF||0)+(+l.weanedM||0)))add('litters',l.id,'born',(+l.weanedF||0)+(+l.weanedM||0),`Litter ${l.num} (${litBreeding(l)?.name||''}): pups born`,'= pups weaned');}
  // 3. mice: from their litter / breeding
  for(const m of mice){const l=m.litter&&byId('litters',m.litter),b=l&&litBreeding(l);const nm=`Mouse ${m.tag}`;
    if(l){if(!m.dob&&l.dob)add('mice',m.id,'dob',l.dob,`${nm}: DOB`,`litter ${l.num} born ${fmtDate(l.dob)}`);
      if(!m.sire&&b&&b.male)add('mice',m.id,'sire',b.male,`${nm}: sire`,`${mouseLabel(b.male)} (breeding ${b.name})`);
      const dam=l.dam||((b&&(b.females||[]).length===1)?b.females[0]:'');if(!m.dam&&dam)add('mice',m.id,'dam',dam,`${nm}: dam`,`${mouseLabel(dam)} (litter ${l.num})`);
      if(!m.strain&&b&&b.strain)add('mice',m.id,'strain',b.strain,`${nm}: strain`,strainName(b.strain));
      if(!m.generation&&b&&b.generation)add('mice',m.id,'generation',b.generation,`${nm}: generation`,`breeding ${b.name}`)}}
  // 4. mice: from cage-mates born the same day (same litter in practice)
  const got=(id,k)=>P.some(x=>x.id===id&&x.k===k);
  for(const m of mice){if(!m.cage)continue;const mates=liveIn(m.cage).filter(x=>x.id!==m.id&&x.dob&&x.dob===m.dob&&x.strain===m.strain);if(!mates.length||!m.dob)continue;const nm=`Mouse ${m.tag}`;
    for(const [k,lab] of [['sire','sire'],['dam','dam'],['generation','generation'],['owner','owner'],['protocol','protocol']]){if(m[k]||got(m.id,k))continue;
      const vals=uniq(mates.map(x=>x[k]).filter(Boolean));if(vals.length===1)add('mice',m.id,k,vals[0],`${nm}: ${lab}`,`same as cage-mates born ${fmtDate(m.dob)}`)}
    if(!m.sex){const sx=uniq(liveIn(m.cage).filter(x=>x.id!==m.id).map(x=>x.sex));if(sx.length===1&&(sx[0]==='F'||sx[0]==='M')&&!breedingIn(m.cage))add('mice',m.id,'sex',sx[0],`${nm}: sex`,`all cage-mates are ${sx[0]==='F'?'♀':'♂'}`)}}
  // 5. pure inbred stock: genotype WT

    if(st.noGeno)add('mice',m.id,'genotype',st.fixedGeno||'WT',`Mouse ${m.tag}: genotype`,`${st.name} needs no genotyping`)}

  return P}
function smartFill(){const P=inferFixes();if(!P.length){openModal(`<div class="mh"><h3>Fill missing info</h3><button class="x" onclick="closeModal()">×</button></div><p>Nothing can be filled in automatically right now — everything that can be worked out from the existing records is already there.</p>`);return}

/* ===================== v128: offline saving =====================
   A change made without a connection is kept on this phone (shown right away, listed as "waiting"),
   and sent to the server automatically, in order, when the connection is back. Before sending, the app checks
   whether someone else changed the same record meanwhile and asks which version to keep. */
const QK='kc_offq_v1';
function qAll(){try{const q=JSON.parse(localStorage.getItem(QK)||'[]');return Array.isArray(q)?q:[]}catch(e){return []}}
function qSave(q){try{localStorage.setItem(QK,JSON.stringify(q));return true}catch(e){return false}}
function qMine(){const u=ME?.user;return u?qAll().filter(x=>x.user===u):[]}
function QN(){try{return MODE==='server'&&ME?qMine().length:0}catch(e){return 0}}
function qOK(){return MODE==='server'&&!!ME&&!TRAINEE()}
const qKey=o=>o.c+'/'+(o.t==='put'?o.r.id:o.id);
const qJS=r=>JSON.stringify(r==null?null:r);
function qAdd(ops,msg,quiet){if(!ops||!ops.length)return true;
  const base={};for(const o of ops){const k=qKey(o);if(!(k in base)){const id=o.t==='put'?o.r.id:o.id;base[k]=qJS(byId(o.c,id))}}
  const q=qAll();q.push({id:uid(),user:ME.user,t:Date.now(),msg:msg||'Change',ops,base});
  if(!qSave(q)){toast('Offline, and this phone has no room to keep the change — it was NOT saved',true);return false}
  S=normalize(applyOps(JSON.parse(JSON.stringify(S)),ops,(msg||'Change')+' ⏳',ME.user));render();saveCache();
  setSync(navigator.onLine===false?'off':'queue');
  if(!quiet)toast(`⏳ Saved on this phone — sent when you're back online${msg?' · '+msg:''}`);
  return true}
/* put waiting changes back on top of a fresh server copy (used when sending is not possible yet) */
function qReapply(){for(const x of qMine())S=normalize(applyOps(JSON.parse(JSON.stringify(S)),x.ops,x.msg+' ⏳',x.user));saveCache()}
function qName(c,r){if(!r)return '';return c==='mice'?'mouse '+(r.tag||''):c==='cages'?'cage '+(r.label||''):c==='litters'?'litter '+(r.num||''):c==='breedings'?'breeding '+(r.name||''):(r.name||r.title||r.label||c)}
let QF=null;
function qFlush(){if(QF)return QF;QF=(async()=>{try{
    if(!qOK()||!QN())return true;
    let cur;try{cur=normalize(await api('state'))}catch(e){if(e.status===401)showLogin();setSync(navigator.onLine===false?'off':'queue');return false}
    let sent=0,dropped=0;
    for(const x of qMine()){
      const after=JSON.parse(JSON.stringify(cur));for(const o of x.ops){if(o.t==='put'){const i=after[o.c]?.findIndex(r=>r.id===o.r.id);if(i>=0)after[o.c][i]=o.r;else after[o.c]?.push(o.r)}else if(after[o.c])after[o.c]=after[o.c].filter(r=>r.id!==o.id)}
      const clash=Object.entries(x.base).filter(([k,b])=>{const [c,id]=k.split('/');const srv=qJS((cur[c]||[]).find(r=>r.id===id));
        const mine=qJS((after[c]||[]).find(r=>r.id===id));return srv!==b&&srv!==mine}).map(([k])=>{const [c,id]=k.split('/');return qName(c,(cur[c]||[]).find(r=>r.id===id)||byId(c,id))||c}).filter(Boolean);
      let keep=true;
      if(clash.length)keep=confirm(`While you were offline, someone else also changed ${[...new Set(clash)].join(', ')}.\n\nYour offline change: "${x.msg}"\n\nOK = save your offline change on top\nCancel = keep their version (your change is dropped)`);
      const rest=()=>qSave(qAll().filter(y=>y.id!==x.id));
      if(!keep){rest();dropped++;continue}
      const tm=new Date(x.t);const hm=`${pad(tm.getHours())}:${pad(tm.getMinutes())}`;
      try{cur=normalize(await api('ops',{ops:x.ops,msg:`${x.msg} (made offline ${tm.toDateString()===new Date().toDateString()?hm:fmtDate(isoOf(tm))+' '+hm})`}));rest();sent++}
      catch(e){if(!e.status){setSync('queue');if(sent){S=cur;qReapply();render()}return false}
        if(e.status===401){showLogin();return false}
        rest();dropped++;toast(`Could not save "${x.msg}": ${e.message}`,true)}}
    S=cur;render();saveCache();setSync('ok');
    if(sent)toast(`✓ ${sent} offline change${sent>1?'s':''} sent to the server${dropped?` · ${dropped} dropped`:''}`);
    else if(dropped)toast(`${dropped} offline change${dropped>1?'s':''} dropped — kept the other version`);
    return true}finally{QF=null}})();return QF}
function qInfo(){const L=qMine();if(!L.length){toast('Everything is saved ✓');return}
  openSheet(`<h3>⏳ Waiting to send</h3><p class="mute" style="margin-top:0">These changes are saved on this phone and are sent automatically when the server can be reached. Keep this page open or come back online soon.</p>
   <div class="slist">${L.map(x=>`<div style="padding:8px 4px;border-bottom:1px solid var(--line)"><b>${esc(x.msg)}</b><br><small class="mute">${new Date(x.t).toLocaleString()}</small></div>`).join('')}</div>
   <div style="display:flex;gap:8px;margin-top:12px"><button class="btn pri" onclick="closeSheet();qFlush().then(ok=>{if(!ok)toast('Still offline — will try again automatically',true)})">Send now</button></div>`)}
addEventListener('online',()=>setTimeout(()=>{if(QN())qFlush()},1500));
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&QN()&&navigator.onLine!==false)qFlush()});

/* ---------- commit wrapper: recycle bin + sync status ---------- */
async function commit(ops,msg,quiet,noUndo){
  const extra=[];
  if(!/^Undid|^Restored from recycle bin|^Emptied/.test(msg||''))for(const o of ops)if(o.t==='del'&&o.c!=='meta'){const r=byId(o.c,o.id);if(r)extra.push(put('meta',{id:'bin_'+uid(),kind:'bin',c:o.c,r:JSON.parse(JSON.stringify(r)),at:Date.now(),by:ME?.user||'',msg:msg||''}))}
  if(navigator.onLine===false){if(qOK())return qAdd(extra.length?[...ops,...extra]:ops,msg,quiet);setSync('off');toast('You are offline — changes cannot be saved right now',true);return false}
  setSync('saving');const ok=await commitBase(extra.length?[...ops,...extra]:ops,msg,quiet,noUndo);setSync(ok?'ok':'err');return ok}

function searchHits(q){q=String(q||'').trim().toLowerCase();if(!q)return [];const R=[];const low=s=>String(s||'').toLowerCase();
  const sc=(s,base)=>{const v=low(s);return v===q?base:v.startsWith(q)?base+1:v.includes(q)?base+2:-1};
  for(const m of S.mice){const w=sc(m.tag,0);if(w<0)continue;R.push({k:'mouse',id:m.id,t:m.tag+earP(m),s:`${m.sex==='F'?'♀ ':m.sex==='M'?'♂ ':''}${strainName(m.strain)} · ${m.cage&&isLive(m)?cageLabel(m.cage):isLive(m)?'no cage':m.status}`,w:w+(isLive(m)?0:5)})}
  for(const c of S.cages){const w=sc(c.label,0);if(w<0)continue;const n=liveIn(c.id).length;R.push({k:'cage',id:c.id,t:c.label,s:`${n} mice${breedingIn(c.id)?' · ♥ breeding':''} · ${locOf(c)||'staging'}`,w})}
  for(const b of S.breedings){const w=sc(b.name,0);if(w<0)continue;R.push({k:'breeding',id:b.id,t:b.name,s:`${strainName(b.strain)} · ${b.status}`,w:w+(b.status==='active'?0:3)})}
  for(const l of S.litters.filter(litActive)){const b=litBreeding(l);const w=sc(b?.name,1);if(w<0)continue;R.push({k:'litter',id:l.id,t:`${b.name} · Litter ${l.num}`,s:`born ${fmtDate(l.dob)} · ${+l.born?+l.born+' pups':'not counted'}`,w})}

function cageFlags(c){const F=[];const lit=activeLitterIn(c.id);

  if(cardLive(c)&&cardIssues(c).length)F.push(['info','card info missing']);
  if(cardLive(c)&&c.printSig!==cardSig(c))F.push(['print','reprint card']);
  if(liveIn(c.id).length>(+settings().cageCap||5))F.push(['bad','over capacity']);return F}

function confetti(n=120,x,y){if(RM())return;const cv=document.createElement('canvas');cv.className='fun-cv';document.body.appendChild(cv);const W=cv.width=innerWidth,H=cv.height=innerHeight;const g=cv.getContext('2d');

  const P=Array.from({length:n},()=>({x,y,vx:(Math.random()-.5)*12,vy:-Math.random()*12-4,r:Math.random()*6+3,c:cols[Math.random()*cols.length|0],a:Math.random()*6,s:Math.random()<.25}));

/* ---------- interactive weaning ---------- */
function weanPlayground(ops,msg){return new Promise(res=>{if(document.getElementById('fw')){res(false);return}
  const cages=ops.filter(o=>o.t==='put'&&o.c==='cages').map(o=>o.r);
  const pups=ops.filter(o=>o.t==='put'&&o.c==='mice'&&cages.some(c=>c.id===o.r.cage)).map(o=>o.r);
  const lit=ops.find(o=>o.t==='put'&&o.c==='litters')?.r;const b=lit&&byId('breedings',lit.breeding);
  const plan={};pups.forEach(p=>plan[p.cage]=(plan[p.cage]||0)+1);
  const cSex=id=>pups.find(p=>p.cage===id)?.sex||'U';
  const placed={};// pupId -> cageId
  /* each cage keeps its own run of consecutive IDs (e.g. 1–3 in -1, 4–6 in -2); pups get the next ID as they land */
  const cageTags={};pups.slice().sort((a,b)=>natCmp(a.tag,b.tag)).forEach(p=>(cageTags[p.cage]=cageTags[p.cage]||[]).push(p.tag));
  const order=pups.slice().sort(()=>Math.random()-.5);
  const ov=document.createElement('div');ov.id='fw';
  ov.innerHTML=`<div class="fw-box"><div class="fw-h"><div><b>Weaning time!</b><span>${esc(b?.name||'')} · Litter ${lit?.num||''} — drag each pup into a cage of the right sex — IDs are given in order as pups go in</span></div><button class="x" data-x>×</button></div>
   <div class="fw-stage"><div class="fw-nest"><div class="fw-lbl">🏠 ${esc(b?.cage?cageLabel(b.cage):'Nest')} <small>parents' cage</small></div><div class="fw-pups">${order.map((p,i)=>`<div class="fw-pup" data-id="${p.id}" data-sex="${p.sex}" style="--d:${(i%5)*.15}s">${mouseSVG(p.sex,46,{flip:Math.random()<.5})}<i>${p.sex==='F'?'♀':p.sex==='M'?'♂':'?'}</i></div>`).join('')}</div></div>
   <div class="fw-arrow">➜</div>
   <div class="fw-cages">${cages.map(c=>`<div class="fw-cage ${cSex(c.id)}" data-id="${c.id}" data-sex="${cSex(c.id)}"><div class="fw-cl"><b>${esc(c.label)}</b><span>${cSex(c.id)==='F'?'♀ girls':'♂ boys'} · <em>0</em>/${plan[c.id]||0}${c.pos?` · ${esc(c.rack||'')} ${esc(c.pos)}`:''}</span></div><div class="fw-in"></div></div>`).join('')}</div></div>
   <div class="fw-f"><span class="fw-score">0 / ${pups.length} pups moved</span><span class="sp"></span><button class="btn" data-auto>✨ Auto-sort</button><button class="btn pri" data-go disabled>Wean! 🎉</button></div></div>`;
  document.body.appendChild(ov);requestAnimationFrame(()=>ov.classList.add('on'));
  const upd=()=>{const n=Object.keys(placed).length;ov.querySelector('.fw-score').textContent=`${n} / ${pups.length} pups moved`;
    ov.querySelectorAll('.fw-cage').forEach(c=>c.querySelector('em').textContent=Object.values(placed).filter(x=>x===c.dataset.id).length);
    const go=ov.querySelector('[data-go]');go.disabled=n<pups.length;if(n===pups.length&&!go.dataset.done){go.dataset.done=1;confetti(140);squeak();go.classList.add('fw-ready')}};
  const room=cid=>Object.values(placed).filter(x=>x===cid).length<(plan[cid]||0);
  const drop=(el,cid,anim,from)=>{const pid=el.dataset.id;const k=Object.values(placed).filter(x=>x===cid).length;placed[pid]=cid;const lab=el.querySelector('i');if(lab){lab.textContent=(cageTags[cid]||[])[k]||'';lab.classList.add('fw-new')}const inn=ov.querySelector(`.fw-cage[data-id="${cid}"] .fw-in`);
    const r0=from||el.getBoundingClientRect();inn.appendChild(el);el.classList.add('in');const r1=el.getBoundingClientRect();
    if(!RM()){if(from)el.animate([{transform:`translate(${r0.left-r1.left}px,${r0.top-r1.top}px) scale(1.15)`},{transform:'none'}],{duration:220,easing:'cubic-bezier(.2,.8,.3,1.2)'});else el.animate([{transform:`translate(${r0.left-r1.left}px,${r0.top-r1.top}px)`},{transform:`translate(${(r0.left-r1.left)/2}px,${(r0.top-r1.top)/2-60}px)`,offset:.5},{transform:'none'}],{duration:anim?520:260,easing:'cubic-bezier(.3,.7,.3,1)'})}
    ov.querySelector(`.fw-cage[data-id="${cid}"]`).animate?.([{transform:'scale(1)'},{transform:'scale(1.05)'},{transform:'scale(1)'}],{duration:300});squeak();upd()};
  // pointer drag (works with fingers too)
  let drag=null;
  ov.addEventListener('pointerdown',e=>{const p=e.target.closest('.fw-pup');if(!p||p.classList.contains('in'))return;e.preventDefault();const r=p.getBoundingClientRect();
    drag={p,dx:e.clientX-r.left,dy:e.clientY-r.top,x0:e.clientX,y0:e.clientY};delete p.dataset.moved;p.classList.add('drag');p.style.left=r.left+'px';p.style.top=r.top+'px';p.setPointerCapture?.(e.pointerId)});
  ov.addEventListener('pointermove',e=>{if(!drag)return;if(Math.abs(e.clientX-drag.x0)+Math.abs(e.clientY-drag.y0)>6)drag.p.dataset.moved='1';drag.p.style.left=(e.clientX-drag.dx)+'px';drag.p.style.top=(e.clientY-drag.dy)+'px';
    ov.querySelectorAll('.fw-cage').forEach(c=>{const r=c.getBoundingClientRect();c.classList.toggle('hov',e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top&&e.clientY<r.bottom)})});
  ov.addEventListener('pointerup',e=>{if(!drag)return;const {p}=drag;drag=null;const fromR=p.getBoundingClientRect();p.classList.remove('drag');p.style.left=p.style.top='';ov.querySelectorAll('.fw-cage').forEach(c=>c.classList.remove('hov'));
    const tgt=[...ov.querySelectorAll('.fw-cage')].find(c=>{const r=c.getBoundingClientRect();return e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top&&e.clientY<r.bottom});
    if(!tgt)return;if(tgt.dataset.sex!==p.dataset.sex){p.animate?.([{transform:'translateX(0)'},{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'translateX(0)'}],{duration:300});toast(p.dataset.sex==='F'?'Oops — that one is a girl! ♀':'Oops — that one is a boy! ♂',true);return}
    if(!room(tgt.dataset.id)){const other=cages.find(c=>c.id!==tgt.dataset.id&&cSex(c.id)===p.dataset.sex&&room(c.id));if(other){toast(`${tgt.querySelector('b').textContent} is full — ${other.label} has room`);return}return}
    drop(p,tgt.dataset.id,false,fromR)});
  // tap a pup = send it to the next cage with room
  ov.addEventListener('click',e=>{const p=e.target.closest('.fw-pup');if(!p||p.classList.contains('in'))return;if(p.dataset.moved){delete p.dataset.moved;return}const c=cages.find(c=>cSex(c.id)===p.dataset.sex&&room(c.id));if(c)drop(p,c.id,true)});
  ov.querySelector('[data-auto]').onclick=async()=>{const left=[...ov.querySelectorAll('.fw-nest .fw-pup')];for(const p of left){const c=cages.find(c=>cSex(c.id)===p.dataset.sex&&room(c.id));if(c){drop(p,c.id,true);await new Promise(r=>setTimeout(r,RM()?0:170))}}};
  const close=v=>{ov.classList.remove('on');setTimeout(()=>ov.remove(),250);res(v)};
  ov.querySelector('[data-x]').onclick=()=>close(false);
  ov.querySelector('[data-go]').onclick=()=>{// IDs were handed out per cage in order, so the planned records are saved as they are
    ov.querySelectorAll('.fw-cage').forEach((c,i)=>setTimeout(()=>c.classList.add('fly'),i*120));setTimeout(()=>{close(true);confetti(160)},600)};
})}

/* ===== Activity: undo / redo any recent change =====

   to undo it; the undo is added to the list as its own item, which can be redone. */

  for(let i=A.length-1;i>=0;i--){const a=A[i];if(!a.ref||!a.k)continue;
    if(a.k==='undo'){st[a.ref]='undone';st[root(a.ref)]='undone'}

  if(mode==='owner'){const o=rvOwner(c);if(!o)return ['#adb5bd','No owner',999];const [col,i]=rvCatColor('owner',o);return [col,o,i]}
  if(mode==='protocol'){const p=rvProt(c);if(!p)return ['#adb5bd','No protocol',999];const [col,i]=rvCatColor('protocol',p);return [col,p,i]}

function rvBar(){return `<div class="rvbar"><label class="rvsel"><span>Colour by</span><select onchange="rvSet('color',this.value)">${RV_MODES.map(([v,l])=>`<option value="${v}"${RV.color===v?' selected':''}>${l}</option>`).join('')}</select></label>

/* numbers above each rack */

  const sx=cardStrain(c,breedingIn(c.id));if(sx){h=h.replace(/(<b>[^<]*<\/b>)/,`$1<span class="tst" title="${esc(sx.name)}">${esc(strainShort(sx))}</span>`)}
  if(RVHL)cls+=sx&&sx.id===RVHL?' hlon':' hloff';

/* pinch on the racks: fingers together = compact, apart = full */
(()=>{let d0=0,done=false;const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);

let TAPALL=(()=>{try{return localStorage.getItem('kc_tapall')!=='0'}catch(e){return true}})();

const mzi=(sex,sz=40,flip)=>mouseSVG(sex==='F'||sex==='M'?sex:'U',sz,{flip});
function playOpen(title,sub,body,foot,cls=''){const old=document.getElementById('pl');if(old)old.remove();
  const ov=document.createElement('div');ov.id='pl';ov.className=cls;
  ov.innerHTML=`<div class="fw-box pl-box"><div class="fw-h"><div><b>${title}</b><span>${sub||''}</span></div><button class="x" data-x>×</button></div><div class="pl-body">${body}</div><div class="fw-f pl-foot">${foot||''}</div></div>`;

function playClose(){const ov=document.getElementById('pl');if(!ov)return;ov.classList.remove('on');setTimeout(()=>ov.remove(),220)}
/* shared drag-or-tap engine: items can be dragged onto targets, or tapped then a target tapped */
function playDnD(ov,itemSel,targetSel,onDrop){let drag=null,sel=null;
  const pick=el=>{ov.querySelectorAll(itemSel+'.picked').forEach(x=>x.classList.remove('picked'));sel=el;if(el)el.classList.add('picked')};
  ov.addEventListener('pointerdown',e=>{const it=e.target.closest(itemSel);if(!it||it.classList.contains('locked'))return;const r=it.getBoundingClientRect();
    drag={it,x0:e.clientX,y0:e.clientY,dx:e.clientX-r.left,dy:e.clientY-r.top,g:null,r}});
  ov.addEventListener('pointermove',e=>{if(!drag)return;if(!drag.g){if(Math.abs(e.clientX-drag.x0)+Math.abs(e.clientY-drag.y0)<7)return;
      drag.g=drag.it.cloneNode(true);drag.g.classList.add('pl-ghost');drag.g.style.cssText=`position:fixed;left:${drag.r.left}px;top:${drag.r.top}px;width:${drag.r.width}px;z-index:600;pointer-events:none`;document.body.appendChild(drag.g);drag.it.style.opacity='.25'}
    drag.g.style.left=(e.clientX-drag.dx)+'px';drag.g.style.top=(e.clientY-drag.dy)+'px';
    ov.querySelectorAll(targetSel).forEach(t=>{const r=t.getBoundingClientRect();t.classList.toggle('hov',e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top&&e.clientY<r.bottom)})});
  ov.addEventListener('pointerup',e=>{if(!drag)return;const D=drag;drag=null;ov.querySelectorAll(targetSel).forEach(t=>t.classList.remove('hov'));
    if(!D.g){/* tap */const tg=e.target.closest(targetSel);if(sel&&tg&&!e.target.closest(itemSel)){onDrop(sel,tg,null);pick(null);return}pick(sel===D.it?null:D.it);return}
    const gr=D.g.getBoundingClientRect();D.g.remove();D.it.style.opacity='';
    const tg=[...ov.querySelectorAll(targetSel)].find(t=>{const r=t.getBoundingClientRect();return e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top&&e.clientY<r.bottom});
    if(tg)onDrop(D.it,tg,gr)});
  ov.addEventListener('click',e=>{if(!sel)return;const tg=e.target.closest(targetSel);if(tg&&!e.target.closest(itemSel)){onDrop(sel,tg,null);pick(null)}});
  return {pick}}

  const ov=playOpen('Matchmaker 💘','Drag a male and one or two females into the love cage','',`<span class="sp"></span><button class="btn" onclick="playClose()">Cancel</button><button class="btn pri" data-go disabled>Next ›</button>`,'pl-mm');

  ov.querySelector('[data-go]').onclick=async()=>{const d=$('#rtD').value||today();const ops=[put('breedings',{...b,status:'retired',endDate:d,cageLabel:c?c.label:(b.cageLabel||'')})];
    let kept=0;ms.forEach(m=>{const w=where[m.id]||'keep';if(w==='keep')kept++;else ops.push(mput({...m,status:w,endDate:d,cage:''},m))});

function pairSuggest(){const out=[],used=new Set();const A=m=>ageDays(m)??-1;

  const gok=m=>noGenoStrain(m.strain)||(m.genotype&&!/^pending$/i.test(m.genotype))?1:0;
  const Ms=S.mice.filter(m=>m.sex==='M'&&ok(m)).sort((a,b)=>(gok(b)-gok(a))||(A(b)-A(a))),Fs=S.mice.filter(m=>m.sex==='F'&&ok(m));
  for(const M of Ms){const c=Fs.filter(f=>!used.has(f.id)&&f.strain===M.strain&&!rel(M,f)).sort((a,b)=>(gok(b)-gok(a))||(Math.abs(A(a)-A(M))-Math.abs(A(b)-A(M))));

{const _cd=cageDetail;cageDetail=function(id,...r){if(window._CDFULL){window._CDFULL=false;return _cd(id,...r)}if(VIEW==='cages'&&Q.cg.tab==='map'&&cdrOn()&&!$('#modal').classList.contains('open'))return cdrOpen(id);return _cd(id,...r)}}
{const _r=render;render=function(){_r();try{if(CDR.id){if(VIEW!=='cages'||!byId('cages',CDR.id))cdrClose();else{const p=document.getElementById('cdr');if(p)p.innerHTML=cdrHtml(byId('cages',CDR.id));cdrMark()}}}catch(e){console.warn('cdr',e)}}}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&CDR.id&&!$('#modal').classList.contains('open'))cdrClose()});
/* ⚙ View: choose what tapping a cage does */
{const _v=rvViewSheet;rvViewSheet=function(){_v();const pnl=document.querySelector('#sheet .rt-panel');if(!pnl)return;
  pnl.insertAdjacentHTML('beforeend',`<b>Tap a cage</b><div class="rt-seg"><button class="${cdrOn()?'on':''}" onclick="RT.panel=true;rtSave();rvViewSheet()">Side panel</button><button class="${cdrOn()?'':'on'}" onclick="RT.panel=false;rtSave();cdrClose();rvViewSheet()">Full window</button></div>`)}}

/* ===================== v119: one window at a time, with Back (Koelony 2 behaviour) =====================
   Opening a window from another one REPLACES it (never hidden behind it). A "‹ Back to …" bar returns to the
   previous window, freshly redrawn. × or tapping outside closes everything. When a step inside a window finishes
   (a picker, a form), the app closes it and you land back on the window you came from. */
(function(){
  const ST=[];let going=false,userClose=false;
  const M=()=>document.getElementById('modal'),SH=()=>document.getElementById('sheet');
  const isOpen=e=>!!e&&e.classList.contains('open')&&!e.classList.contains('closing');
  const _om=openModal,_os=openSheet,_cm=closeModal,_cs=closeSheet;
  const clean=root=>{const c=root.cloneNode(true);c.querySelectorAll('.mx,.shx,.grab,.kwbar').forEach(x=>x.remove());return c.innerHTML};
  const titleOf=html=>{const d=document.createElement('div');d.innerHTML=html;const h=d.querySelector('h1,h2,h3');return h?h.textContent.replace(/\s+/g,' ').trim().slice(0,60):''};
  const sameSrc=(a,b)=>!!a&&!!b&&a.n===b.n&&JSON.stringify(a.a)===JSON.stringify(b.a);
  const drawerOpen=()=>!!document.getElementById('cdr')&&typeof CDR!=='undefined'&&!!CDR.id;
  function current(){
    if(drawerOpen()&&!isOpen(M())&&!isOpen(SH())){const c=byId('cages',CDR.id);return {t:'d',id:CDR.id,html:`<h3>Cage ${esc(c?c.label:'')}</h3>`,y:0,src:null}}
    if(isOpen(M())){const b=M().querySelector('.box');return {t:'m',html:clean(b),wide:b.classList.contains('wide'),y:b.scrollTop,src:window._MDC||null}}
    if(isOpen(SH())){const b=SH().querySelector('.sh');return {t:'s',html:clean(b),y:b.scrollTop,src:window._SHC||null}}
    return null}
  function chrome(){
    const host=isOpen(SH())?SH().querySelector('.sh'):isOpen(M())?M().querySelector('.box'):null;if(!host)return;
    host.querySelectorAll('.kwbar').forEach(x=>x.remove());
    host.querySelectorAll('.mx .x,.shx .x').forEach(x=>{x.onclick=e=>{e.preventDefault();e.stopPropagation();winCloseAll()}});
    const bd=SH().querySelector('.bd');if(bd)bd.onclick=()=>winCloseAll();
    if(!ST.length)return;
    const prev=ST[ST.length-1],t=titleOf(prev.html);
    const bar=document.createElement('div');bar.className='kwbar';
    bar.innerHTML=`<button type="button" class="kbk" onclick="winBack()">‹ Back${t?' to '+esc(t):''}</button>`;
    const after=host.querySelector('.grab')||host.querySelector('.shx')||host.querySelector('.mx');
    if(after)after.after(bar);else host.prepend(bar)}
  // decide whether a new window is a NEW place (push the current one) or just a redraw of the same one
  function willOpen(html,src){
    if(going)return;
    const cur=current();if(!cur)return;
    const redraw=sameSrc(cur.src,src)||(!src&&!cur.src&&titleOf(html)&&titleOf(html)===titleOf(cur.html));
    if(redraw)return;
    ST.push(cur);if(ST.length>12)ST.shift()}
  openModal=function(html,wide){
    const src=window._MDN||null;willOpen(html,src);
    if(isOpen(SH())){SH().classList.remove('open','closing')}           // replace, don't stack
    if(drawerOpen()&&!going)cdrClose();                                  // the cage panel steps aside too
    const r=_om.apply(this,arguments);chrome();return r};
  openSheet=function(html){
    const src=window._MDN||null;const was=isOpen(SH());willOpen(html,src);
    if(isOpen(M())){M().classList.remove('open')}                       // replace, don't stack
    if(drawerOpen()&&!going)cdrClose();
    window._SHC=src;
    const r=_os.apply(this,arguments);
    const sh=SH().querySelector('.sh');if(sh&&was&&ST.length&&!sameSrc(src,ST[ST.length-1].src)&&!going){/* new place in the same sheet: start at the top */}
    chrome();return r};
  function restore(e){
    going=true;
    try{
      let ok=false;
      // skip windows whose record no longer exists (e.g. the cage was just ended)
      const COL={cageDetail:'cages',mouseDetail:'mice',breedDetail:'breedings',litterDetail:'litters'};
      const gone=x=>x&&((x.t==='d'&&!byId('cages',x.id))||(x.src&&COL[x.src.n]&&!byId(COL[x.src.n],x.src.a[0])));
      while(gone(e)){e=ST.pop();if(!e)return}
      if(e.t==='d'){cdrOpen(e.id);return}
      if(e.src&&typeof window[e.src.n]==='function'){try{if(e.src.n==='cageDetail')window._CDFULL=true;window[e.src.n](...e.src.a);ok=isOpen(M())||isOpen(SH())}catch(err){ok=false}}
      if(!ok){if(e.t==='m')_om(e.html,e.wide);else{window._SHC=null;_os(e.html)}}
      const host=isOpen(SH())?SH().querySelector('.sh'):isOpen(M())?M().querySelector('.box'):null;
      if(host){host.scrollTop=e.y||0;requestAnimationFrame(()=>{host.scrollTop=e.y||0})}
    }finally{going=false}
    chrome()}
  window.winBack=function(){const e=ST.pop();if(!e){winCloseAll();return}
    if(isOpen(M()))M().classList.remove('open');if(isOpen(SH()))SH().classList.remove('open','closing');restore(e)};
  window.winCloseAll=function(){ST.length=0;userClose=true;try{if(isOpen(SH()))_cs();if(M().classList.contains('open'))_cm()}finally{userClose=false}};
  // a step finished inside a window (code closed it): go back to the window it came from
  closeModal=function(...a){if(!userClose&&!going&&ST.length&&isOpen(M())){M().classList.remove('open');const e=ST.pop();setTimeout(()=>{if(!isOpen(M())&&!isOpen(SH()))restore(e);else if(e){ST.push(e);chrome()}},0);return}
    if(!userClose)ST.length=0;return _cm.apply(this,a)};
  closeSheet=function(...a){if(!userClose&&!going&&ST.length&&isOpen(SH())){SH().classList.remove('open','closing');const e=ST.pop();setTimeout(()=>{if(!isOpen(M())&&!isOpen(SH()))restore(e);else if(e){ST.push(e);chrome()}},0);return}
    if(!userClose)ST.length=0;return _cs.apply(this,a)};
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(isOpen(M())||isOpen(SH()))){e.preventDefault();ST.length?winBack():winCloseAll()}});
})();

/* ===================== v120: Card colours screen =====================
   One row per strain with a live mini card (breeder + offspring, the current card style: stripe + coloured header).
   Tap a colour to change the strain's hue; two sliders set how strong each shade prints (lighter = less ink).
   The hue and strengths are kept on the strain (cardHue / cardB / cardO) so they can be re-edited later;
   color (breeder) and colorLight (offspring) are what the cards print. */
const CCX_PAL=['#1f4e9e','#2f3a8f','#3949ab','#0e7c86','#00796b','#1d7a3a','#4e7d00','#5c4a00','#c25a00','#b02a2a','#8a1538','#a3196b','#7b2fa8','#9c27b0','#6b3e1f','#455a64'];
const CCX_B=[0,.15,.3,.45,.6];           // breeder shade: 0 = full colour … .6 = light
const CCX_O=[.55,.68,.78,.86,.93];       // offspring shade: .55 = strong … .93 = very pale
const ccxNear=(arr,v)=>arr.reduce((a,b)=>Math.abs(b-v)<Math.abs(a-v)?b:a);
function ccxOf(st){return {hue:st.cardHue||st.color||'#868e96',b:st.cardB??0,o:st.cardO??(st.colorLight?.68:.68),custom:!st.cardHue&&!!st.colorLight}}
function ccxShades(w){return {dark:mixW(w.hue,w.b),light:mixW(w.hue,w.o)}}
/* colour ink on a 5×3 card: stripe (~4% of the card) + header band (~12%), weighted by how dark the colour is */
function ccxInk(hex,band){const [r,g,b]=hex2rgb(hex);const dk=1-(r+g+b)/765;return (band?.12:0)*dk+.04*dk}
function ccxInkPct(w){const {dark,light}=ccxShades(w);const ref=ccxInk('#1f4e9e',1)+ccxInk(mixW('#1f4e9e',.68),1);
  return Math.round((ccxInk(dark,1)+ccxInk(light,1)*.6+ccxInk(dark,0)*.4)/ref*100)}
function ccxMini(bg,stripe,kind){return `<div class="ccx-card"><i style="background:${stripe}"></i><div class="ccx-hd" style="background:${bg};color:${inkOn(bg)}"><span>${kind}</span></div><div class="ccx-ln"></div><div class="ccx-ln"></div><div class="ccx-ln s"></div></div>`}
let CCX={w:{},open:''};
function ccxRow(st){const w=CCX.w[st.id];const {dark,light}=ccxShades(w);const ink=ccxInkPct(w);const ed=canEdit();
  return `<div class="ccx-row${CCX.open===st.id?' open':''}" id="ccx-${st.id}">
   <button type="button" class="ccx-top" onclick="ccxToggle('${st.id}')" aria-expanded="${CCX.open===st.id}"><span class="ccx-dot" style="background:${dark}"></span><b>${esc(st.name)}</b>
    <span class="ccx-ink" title="Colour ink compared with a standard card">${ink<=55?'🍃 ':''}ink ${ink}%</span></button>
   <div class="ccx-prev">${ccxMini(dark,dark,'BREEDER')}${ccxMini(light,dark,'OFFSPRING')}</div>
   ${CCX.open===st.id&&ed?`<div class="ccx-ed">
     <div class="ccx-lab">Colour</div><div class="ccx-pal">${CCX_PAL.map(c=>`<button type="button" class="${c.toLowerCase()===w.hue.toLowerCase()?'on':''}" style="background:${c}" aria-label="colour ${c}" onclick="ccxSet('${st.id}','hue','${c}')"></button>`).join('')}
      <label class="ccx-own" title="Any colour">＋<input type="color" value="${w.hue}" oninput="ccxSet('${st.id}','hue',this.value,true)"></label></div>
     <div class="ccx-lab">Breeder card shade <small>${['full colour','a bit lighter','lighter','light','very light'][CCX_B.indexOf(ccxNear(CCX_B,w.b))]}</small></div>
     <div class="ccx-sl"><span>strong</span><input type="range" min="0" max="${CCX_B.length-1}" step="1" value="${CCX_B.indexOf(ccxNear(CCX_B,w.b))}" oninput="ccxSet('${st.id}','b',CCX_B[this.value],true)" aria-label="Breeder shade"><span>🍃 light</span></div>
     <div class="ccx-lab">Offspring card shade <small>${['strong','medium','soft','pale','very pale'][CCX_O.indexOf(ccxNear(CCX_O,w.o))]}</small></div>
     <div class="ccx-sl"><span>strong</span><input type="range" min="0" max="${CCX_O.length-1}" step="1" value="${CCX_O.indexOf(ccxNear(CCX_O,w.o))}" oninput="ccxSet('${st.id}','o',CCX_O[this.value],true)" aria-label="Offspring shade"><span>🍃 pale</span></div>
     <div class="ccx-qk"><button type="button" class="btn sm" onclick="ccxPreset('${st.id}',.3,.86)">🍃 Ink saver</button><button type="button" class="btn sm" onclick="ccxPreset('${st.id}',0,.68)">Strong (original)</button></div>
   </div>`:''}</div>`}
function ccxBody(){const L=S.strains.slice().sort((a,b)=>natCmp(a.name,b.name));const dirty=ccxDirty().length;
  return `<div class="mh"><h3>Card colours</h3><button class="x" onclick="closeModal()">×</button></div>
   <p class="mute" style="margin-top:0">Each strain prints a <b>dark shade</b> on breeder cards and a <b>light shade</b> on offspring / holding cards. Tap a strain to change it — lighter shades use less ink.</p>
   <label class="tg" style="display:flex;gap:8px;align-items:center;margin:0 0 10px"><input type="checkbox" ${cardColorsOn()?'checked':''} onchange="try{localStorage.setItem('kc_cardcolor',this.checked?'on':'off')}catch(e){};ccxDraw()"> Print cards in colour on this device</label>
   ${canEdit()?`<div class="ccx-all"><button type="button" class="btn sm" onclick="ccxPresetAll(.3,.86)">🍃 Ink saver for all strains</button><button type="button" class="btn sm" onclick="ccxPresetAll(0,.68)">Strong for all</button><button type="button" class="btn sm" onclick="ccxAuto()">New colour for every strain</button></div>`:''}
   <div class="ccx-list">${L.map(ccxRow).join('')||'<p class="mute">No strains yet.</p>'}</div>
   <div class="mf ed" style="margin-top:12px"><span class="sp"></span><button class="btn" onclick="ccxCancel()">Cancel</button>${canEdit()?`<button class="btn pri" onclick="ccxSave()" ${dirty?'':'disabled'}>Save ${dirty?dirty+' strain'+(dirty>1?'s':''):''}</button>`:''}</div>`}
function ccxDraw(){const b=$('#modal .box');if(!b||!b.querySelector('.ccx-list'))return;const y=b.scrollTop;b.innerHTML='<div class="mx"><button type="button" class="x" onclick="closeModal()" aria-label="Close">×</button></div>'+ccxBody();b.scrollTop=y}
function ccxDirty(){return S.strains.filter(st=>{const w=CCX.w[st.id];if(!w)return false;const {dark,light}=ccxShades(w);return dark.toLowerCase()!==darkOf(st).toLowerCase()||light.toLowerCase()!==lightOf(st).toLowerCase()})}
window.ccxToggle=id=>{CCX.open=CCX.open===id?'':id;ccxDraw();if(CCX.open)setTimeout(()=>document.getElementById('ccx-'+id)?.scrollIntoView({block:'nearest',behavior:'smooth'}),30)};
window.ccxSet=(id,k,v,live)=>{CCX.w[id]={...CCX.w[id],[k]:v};if(live){const st=byId('strains',id),row=document.getElementById('ccx-'+id);const {dark,light}=ccxShades(CCX.w[id]);
    if(row){row.querySelector('.ccx-prev').innerHTML=ccxMini(dark,dark,'BREEDER')+ccxMini(light,dark,'OFFSPRING');row.querySelector('.ccx-dot').style.background=dark;row.querySelector('.ccx-ink').textContent=(ccxInkPct(CCX.w[id])<=55?'🍃 ':'')+'ink '+ccxInkPct(CCX.w[id])+'%';
      const sb=$('#modal .mf .btn.pri');if(sb){const n=ccxDirty().length;sb.disabled=!n;sb.textContent='Save'+(n?' '+n+' strain'+(n>1?'s':''):'')}}
    clearTimeout(window._ccxT);window._ccxT=setTimeout(ccxDraw,500);void st}else ccxDraw()};
window.ccxPreset=(id,b,o)=>{CCX.w[id]={...CCX.w[id],b,o};ccxDraw()};
window.ccxPresetAll=(b,o)=>{for(const st of S.strains)CCX.w[st.id]={...CCX.w[st.id],b,o};ccxDraw()};
window.ccxAuto=()=>{const L=S.strains.slice().sort((a,b)=>natCmp(a.name,b.name));L.forEach((st,i)=>{CCX.w[st.id]={...CCX.w[st.id],hue:CCX_PAL[i%CCX_PAL.length]}});ccxDraw()};
window.ccxCancel=()=>{if(ccxDirty().length&&!confirm('Leave without saving the colour changes?'))return;CCX.w={};closeModal()};
window.ccxSave=async()=>{const D=ccxDirty();if(!D.length){closeModal();return}
  const ops=D.map(st=>{const w=CCX.w[st.id],{dark,light}=ccxShades(w);return put('strains',{...st,color:dark,colorLight:light,cardHue:w.hue,cardB:w.b,cardO:w.o})});
  await commit(ops,`Card colours changed for ${D.length} strain${D.length>1?'s':''}`);CCX.w={};closeModal();
  if(typeof toast==='function')toast('Card colours saved — reprint the cards you want in the new colours')};
cardColors=function(){CCX={w:{},open:''};for(const st of S.strains)CCX.w[st.id]=ccxOf(st);openModal(ccxBody(),true)};

/* ===================== v121: ending cages in a few taps =====================
   1. "End cage" on the cage panel / full record → one window: all sacrificed · all found dead · move all to… · each mouse
   2. "Merge into…" → every mouse moves to the cage you tap, the empty cage is removed
   3. Long-press a cage on the locked rack (or right-click on a computer) → quick menu
   4. When the last mouse leaves a cage, Koelony offers to end it
   5. Select several cages on the rack → "End selected"
   Every ending is ONE change (one Undo): mice updated, active breeding retired, cage to the recycle bin. */
(function(){
  const posRC=p=>{const m=/^(\d+)\s*([A-Z]+)$/i.exec(String(p||''));return m?[+m[1],m[2].toUpperCase().charCodeAt(0)]:null};
  const dist=(a,b)=>{if(!a||!b||a.room!==b.room||(a.rack||'')!==(b.rack||''))return 999;const x=posRC(a.pos),y=posRC(b.pos);return x&&y?Math.abs(x[0]-y[0])+Math.abs(x[1]-y[1]):500};
  const sexes=id=>[...new Set(liveIn(id).map(m=>m.sex||'U'))];
  /* destination cages, best first: same strain, then nearest rack spot */
  function targets(id){const c=byId('cages',id),st=cardStrain(c,breedingIn(id));const mine=sexes(id);
    return S.cages.filter(x=>x.id!==id).map(x=>{const xs=cardStrain(x,breedingIn(x.id)),n=liveIn(x.id).length,xsx=sexes(x.id);
      const mix=n&&mine.length===1&&xsx.length===1&&mine[0]!==xsx[0]&&mine[0]!=='U'&&xsx[0]!=='U';
      return {c:x,n,same:!!st&&!!xs&&xs.id===st.id,d:dist(c,x),br:!!breedingIn(x.id),mix,full:n>=5}})
      .sort((a,b)=>(b.same-a.same)||(a.br-b.br)||(a.d-b.d)||natCmp(a.c.label,b.c.label))}
  function endOps(id,mOps,d){const c=byId('cages',id),ops=[...mOps];
    S.breedings.filter(b=>b.cage===id).forEach(b=>ops.push(put('breedings',{...b,cageLabel:c.label,...(b.status==='active'?{status:'retired',endDate:d}:{})})));
    const lit=activeLitterIn(id);if(lit)ops.push(put('litters',{...lit,inactive:true,notes:[lit.notes,`Cage ${c.label} ended ${d}`].filter(Boolean).join(' | ')}));
    ops.push(del('cages',id));return ops}
  const tgtList=(id,fn)=>{const T=targets(id);return `<input type="search" class="ec-q" placeholder="Find a cage" oninput="const q=this.value.toLowerCase();this.nextElementSibling.querySelectorAll('button').forEach(b=>b.style.display=b.dataset.q.includes(q)?'':'none')">
    <div class="ec-tg">${T.map(t=>`<button type="button" data-q="${esc((t.c.label+' '+locOf(t.c)).toLowerCase())}" onclick="${fn}('${id}','${t.c.id}')"><b>${esc(t.c.label)}</b><small>${esc(locOf(t.c)||'staging')} · ${t.n} 🐭${t.same?' · same strain':''}${t.br?' · ♥ breeding':''}</small>${t.mix?'<em>⚠ other sex inside</em>':t.full?'<em>⚠ already 5</em>':''}</button>`).join('')||'<p class="mute">No other cages.</p>'}</div>`};
  let EC=null;   // {id, mode, date, each:{mouseId: 'sacrificed'|'dead'|cageId}}
  const dateRow=()=>`<div class="ec-date"><span>Date</span><input type="date" value="${EC.date}" max="${today()}" onchange="EC.date=this.value||today()"></div>`;   // the app turns this into Today / Yesterday chips
  function draw(){const c=byId('cages',EC.id);if(!c){closeModal();return}const ms=liveIn(c.id).sort((a,b)=>sexRank(a.sex)-sexRank(b.sex)||natCmp(a.tag,b.tag));
    const lit=activeLitterIn(c.id),b=breedingIn(c.id);
    const head=`<div class="mh"><h3>End cage ${esc(c.label)}</h3><button class="x" onclick="closeModal()">×</button></div>
     <p class="mute" style="margin-top:0">${esc(locOf(c)||'staging')}${ms.length?' · '+ms.map(m=>`${m.sex==='F'?'♀':m.sex==='M'?'♂':''}${esc(m.tag)}`).join(', '):' · empty'}</p>
     ${b?`<p class="ec-note">♥ Breeding ${esc(b.name)} will be retired.</p>`:''}${lit?`<p class="ec-warn">⚠ Litter ${esc(String(lit.num||''))} (${+lit.born||'uncounted'} pups) is still in the nest — it will be marked lost. Wean it first if the pups are alive.</p>`:''}`;
    let body='';
    if(!ms.length)body=`<div class="mf"><span class="sp"></span><button class="btn" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="EC_go()">End empty cage</button></div>`;
    else if(EC.mode==='')body=`<h4>What happens to the ${ms.length>1?ms.length+' mice':'mouse'}?</h4><div class="ec-big">
       <button type="button" onclick="EC_set('mode','sacrificed')">🔬<b>All sacrificed</b><small>euthanized / tissue collected</small></button>
       <button type="button" onclick="EC_set('mode','dead')">🕊️<b>All found dead</b><small>FDIC</small></button>
       <button type="button" onclick="EC_set('mode','move')">➡️<b>Move all to…</b><small>another cage</small></button>
       <button type="button" onclick="EC_set('mode','each')">🧩<b>Each mouse…</b><small>mixed</small></button></div>`;
    else if(EC.mode==='sacrificed'||EC.mode==='dead')body=`<h4>${EC.mode==='dead'?'All found dead':'All sacrificed'}</h4>${dateRow()}
       <div class="mf"><button class="btn" onclick="EC_set('mode','')">‹ Back</button><span class="sp"></span><button class="btn danger" onclick="EC_go()">End cage · ${ms.length} mice</button></div>`;
    else if(EC.mode==='move')body=`<h4>Move all ${ms.length} to… <small class="mute">(tap a cage)</small></h4>${tgtList(c.id,'EC_moveAll')}<div class="mf"><button class="btn" onclick="EC_set('mode','')">‹ Back</button></div>`;
    else{const T=targets(c.id).slice(0,40);
      body=`<h4>Each mouse</h4>${dateRow()}<div class="ec-each">${ms.map(m=>{const v=EC.each[m.id]||'sacrificed';return `<div class="ec-m"><b>${m.sex==='F'?'♀':m.sex==='M'?'♂':''} ${esc(m.tag)}</b>
         <div class="ec-ch"><button type="button" class="${v==='sacrificed'?'on':''}" onclick="EC_each('${m.id}','sacrificed')">Sacrificed</button><button type="button" class="${v==='dead'?'on':''}" onclick="EC_each('${m.id}','dead')">Dead</button>

/* ===================== v122: fewer accidental taps =====================
   1. A tap only counts if the finger stayed still and the screen was not already scrolling (flicks never open things)
   2. Red buttons (end / delete …) need a short hold (0.6 s, a ring fills up); keyboard Enter still works
   3. A second tap on the same button within 0.6 s is ignored (no double opens / double saves); counters are exempt
   4. Bigger targets and more space between buttons; red buttons sit on their own row
   5. Calmer gestures: long-press 0.6 s, swipes need a longer, deliberate move (shake-to-undo stays off unless turned on) */
(function(){
  if(window._TAPSAFE)return;window._TAPSAFE=true;
  const TAP_MOVE=10,SCROLL_QUIET=180,HOLD_MS=600,DOUBLE_MS=600;
  let t0=null,moved=false,lastScroll=0,scrollAtStart=false,lastTouchEnd=0;
  addEventListener('scroll',()=>{lastScroll=Date.now()},{capture:true,passive:true});
  document.addEventListener('touchstart',e=>{if(e.touches.length!==1){t0=null;return}const p=e.touches[0];t0={x:p.clientX,y:p.clientY};moved=false;scrollAtStart=Date.now()-lastScroll<SCROLL_QUIET},{capture:true,passive:true});
  document.addEventListener('touchmove',e=>{if(!t0)return;const p=e.touches[0];if(Math.hypot(p.clientX-t0.x,p.clientY-t0.y)>TAP_MOVE)moved=true},{capture:true,passive:true});
  document.addEventListener('touchend',()=>{lastTouchEnd=Date.now()},{capture:true,passive:true});
  const exempt=el=>!!el.closest('input,select,textarea,label,[contenteditable],.ccx-sl,.nest,[data-rapid]');
  const rapid=el=>{const b=el.closest('button,[role=button],a');if(!b)return true;const tx=(b.textContent||'').trim();
    return tx.length<=2||/^[+−\-–]\s?\d*$/.test(tx)||!!b.closest('.stepper,.stp,.cnt,.nest,.pupn,[data-rapid]')||/step|count|nest|pup|bump|inc|dec/i.test(b.getAttribute('onclick')||'')};
  let lastBtn=null,lastAt=0;
  document.addEventListener('click',e=>{
    const el=e.target;if(!(el instanceof Element))return;
    const fromTouch=Date.now()-lastTouchEnd<700;
    /* 1. scroll-safe taps */
    if(fromTouch&&(moved||scrollAtStart)&&!exempt(el)){e.stopPropagation();e.preventDefault();return}
    /* 3. double-tap guard */
    const b=el.closest('button,[role=button],a[href],a[onclick],.tile,.cdr-m,.ec-tg button');
    if(b&&e.detail!==0&&!exempt(el)&&!rapid(el)){if(b===lastBtn&&Date.now()-lastAt<DOUBLE_MS){e.stopPropagation();e.preventDefault();return}lastBtn=b;lastAt=Date.now()}
  },true);
  /* 2. hold to confirm red buttons */
  const holdable=el=>{const b=el.closest&&el.closest('button.danger,.btn.danger,[data-hold]');return b&&!b.disabled&&!b.closest('[data-nohold]')?b:null};
  let H=null;
  const stopHold=()=>{if(!H)return;clearTimeout(H.t);H.b.classList.remove('holding');H.b.style.removeProperty('--hold');H=null};
  document.addEventListener('pointerdown',e=>{const b=holdable(e.target);if(!b||e.button>0)return;stopHold();
    H={b,x:e.clientX,y:e.clientY,t:setTimeout(()=>{const bb=H&&H.b;stopHold();if(!bb)return;bb._holdOK=Date.now();bb._holdDone=Date.now();try{navigator.vibrate&&navigator.vibrate(25)}catch(x){}bb.click()},HOLD_MS)};
    b.style.setProperty('--hold',HOLD_MS+'ms');b.classList.add('holding')},true);
  document.addEventListener('pointermove',e=>{if(H&&Math.hypot(e.clientX-H.x,e.clientY-H.y)>TAP_MOVE)stopHold()},true);
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>document.addEventListener(ev,e=>{if(H&&(ev!=='pointerleave'||e.target===H.b))stopHold()},true));
  let hintAt=0;
  document.addEventListener('click',e=>{const b=holdable(e.target);if(!b)return;
    if(e.detail!==0&&Date.now()-(b._holdDone||0)<1500){b._holdDone=0;e.stopPropagation();e.preventDefault();return}   // the finger lifting after a finished hold
    if(e.detail===0)return;                                                       // keyboard Enter/Space, or the hold itself
    e.stopPropagation();e.preventDefault();
    if(Date.now()-hintAt>1500){hintAt=Date.now();try{toast('Hold the red button for a moment to confirm')}catch(x){}}
    b.classList.add('holdhint');setTimeout(()=>b.classList.remove('holdhint'),600)},true);
  document.addEventListener('contextmenu',e=>{if(holdable(e.target))e.preventDefault()},true);
})();

(function(){

  const dueCls=d=>{if(!d)return '';const n=diffDays(today(),d);return n<0?'bad':n===0?'warn':''};

  const reqsInCage=cid=>R().filter(r=>open(r)&&(r.mice||[]).some(mid=>{const m=byId('mice',mid);return m&&isLive(m)&&m.cage===cid}));
  const hist=(r,st,note)=>[...(r.hist||[]),{d:today(),t:Date.now(),u:ME?.user||'',s:st,...(note?{n:note}:{})}];

  /* ---------- the request form ---------- */

    return S.mice.filter(m=>isLive(m)&&!ex.has(m.id)&&!breedingOf(m)&&(!f.strain||m.strain===f.strain)&&(f.sex==='any'||m.sex===f.sex)&&(!f.geno||effGeno(m)===f.geno)&&(()=>{const a=ageDays(m);if(a==null)return !f.ageMin&&!f.ageMax;const w=a/7;return (!f.ageMin||w>=f.ageMin)&&(!f.ageMax||w<=f.ageMax)})())
      .sort((a,b)=>natCmp(cageLabel(a.cage),cageLabel(b.cage))||natCmp(a.tag,b.tag))}
  function breedingOf(m){return S.breedings.some(b=>b.status==='active'&&(b.male===m.id||(b.females||[]).includes(m.id)))}

/* ===================== v125: repair litter numbers given out colony-wide (e.g. litter "24" in a cage whose last litter was 7) ===================== */
(function(){let done=false;
  function fixes(){const out=[];const by={};for(const l of S.litters)(by[l.breeding]||=[]).push(l);
    for(const [bid,L] of Object.entries(by)){L.sort((a,b)=>natCmp(a.dob,b.dob)||natCmp(a.id,b.id));let prev=0;
      for(const l of L){const n=+l.num||0;if(n>prev+2){out.push({l,from:n,to:prev+1});prev=prev+1}else prev=Math.max(prev,n)}}
    return out}
  window.litterNumberFixes=fixes;
  async function run(){if(done||!S.litters.length||typeof canEdit!=='function'||!canEdit())return;done=true;const F=fixes();if(!F.length)return;
    const lab=f=>{const b=byId('breedings',f.l.breeding);return (b&&(cageLabel(b.cage)||b.name))||'litter'};
    await commit(F.map(f=>put('litters',{...f.l,num:f.to})),`Fixed litter number${F.length>1?'s':''}: ${F.slice(0,6).map(f=>`${lab(f)} ${f.from} → ${f.to}`).join(', ')}${F.length>6?' …':''}`);
    try{toast(`Fixed ${F.length} litter number${F.length>1?'s':''} (e.g. ${lab(F[0])}: ${F[0].from} → ${F[0].to}) — reprint those cards`)}catch(e){}}
  {const _r=render;render=function(){_r();if(!done)setTimeout(()=>run().catch(e=>console.warn('litnum',e)),1500)}}
})();

/* ===================== v126: deleting a litter asks "lost or a mistake?" =====================
   Lost → the litter stays (so it stays on the cage card) marked inactive with "LOST <date> — reason" in its comments.
   Mistake → the record is removed as before. */
(function(){
  let LD=null;
  function draw(){const l=byId('litters',LD.id);if(!l)return;const b=litBreeding(l);const why=['No survivors','Cannibalized','Found dead','Abandoned'];
    const html=`<div class="ld-root"><div class="mh"><h3>Litter ${esc(String(l.num||''))} · ${esc(b?.name||'')}</h3><button class="x" onclick="closeModal()">×</button></div>
     <p class="mute" style="margin-top:0">Born ${fmtDate(l.dob)}${+l.born?` · ${l.born} pups`:''}. What happened?</p>
     <div class="ec-big">
      <button type="button" class="${LD.mode==='lost'?'on':''}" onclick="LD_set('mode','lost')">🕊️<b>The litter was lost</b><small>keep it on the cage card, marked LOST</small></button>
      <button type="button" class="${LD.mode==='mistake'?'on':''}" onclick="LD_set('mode','mistake')">✏️<b>Entered by mistake</b><small>remove the record</small></button></div>
     ${LD.mode==='lost'?`<h4>Reason <small class="mute">(optional)</small></h4><div class="rq-ch">${why.map(w=>`<button type="button" class="${LD.why===w?'on':''}" onclick="LD_set('why','${w}')">${w}</button>`).join('')}</div>
       <h4>Date</h4><div class="ec-date"><input type="date" value="${LD.date}" max="${today()}" onchange="LD.date=this.value||today()"></div>
       <div class="mf"><span class="sp"></span><button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="LD_go()">Mark litter lost</button></div>`
     :LD.mode==='mistake'?`${S.mice.some(m=>m.litter===l.id)?'<p class="ec-warn">⚠ Mice were weaned from this litter — they are kept, only the litter record goes.</p>':''}
       <div class="mf"><span class="sp"></span><button class="btn" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="LD_go()">Remove litter record</button></div>`:''}</div>`;
    const box=$('#modal .box');if(box&&$('#modal').classList.contains('open')&&box.querySelector('.ld-root'))box.innerHTML='<div class="mx"><button type="button" class="x" onclick="closeModal()" aria-label="Close">×</button></div>'+html;else openModal(html)}
  window.litterDeleteAsk=id=>{if(!canEdit()||!byId('litters',id))return;LD={id,mode:'',why:'',date:today()};window.LD=LD;draw()};

      await commit([put('litters',{...l,inactive:true,alive:0,lostDate:d,notes:[tag,(l.notes||'').replace(/^LOST [^|]*\|?\s*/,'')].filter(Boolean).join(' | ')})],`Litter ${l.num} (${litBreeding(l)?.name||''}) marked lost${LD.why?': '+LD.why:''}`)}
    else if(LD.mode==='mistake')await commit([del('litters',l.id)],`Deleted Litter ${l.num} (entered by mistake)`)};

/* ===================== v127: "Sky & Gold" theme — cartoon sky, gold panels, chunky 3D buttons,
   Today hero (coins, level, cages that need you, round shortcuts, daily bar, big action button) and celebrations.
   Looks only: every screen and button does exactly what it did before. Coins are counted from the activity log. ===================== */
(function(){
  const SKY=()=>SKIN==='sky';
  const fmtN=n=>Number(n).toLocaleString('en-US');
  /* ---------- coins & level (this month, from the activity log) ---------- */
  const SKIP=/^Undid|^Redid|baseline|Filled in|uniform|Card check|Fixed litter numbers|Imported/;
  const VAL=[[/^Weaned/,20],[/ done — /,15],[/^Recorded Litter/,10],[/pups born|^Counted/,10],[/^Genotyped/,10],[/^Ended/,5],[/^Merged/,5],[/printed/i,5],[/^Biopsy/,5]];
  const coinOf=msg=>{if(!msg||SKIP.test(msg))return 0;for(const [r,v] of VAL)if(r.test(msg))return v;return 1};
  function coins(){const me=ME?.user||'';const d=new Date();const m0=new Date(d.getFullYear(),d.getMonth(),1).getTime();
    return S.audit.filter(a=>a.user===me&&a.t>=m0).reduce((s,a)=>s+coinOf(a.msg),0)}
  const LV=[[1,'Lab Rookie'],[3,'Cage Keeper'],[5,'Wean Wizard'],[8,'Breeding Boss'],[12,'Colony Master'],[16,'Mouse Legend']];
  const levelOf=c=>1+Math.floor(Math.sqrt(c/40));
  const titleOf=lv=>LV.filter(([n])=>lv>=n).at(-1)[1];
  window.skyCoins=coins;window.skyLevel=()=>levelOf(coins());

  /* ---------- what needs you today ---------- */
  const openReq=()=>(S.requests||[]).filter(r=>r&&r.status!=='done'&&r.status!=='cancelled');
  const marked=()=>S.cages.filter(c=>(c.marks||[]).length&&liveIn(c.id).length);
  function needs(){const d=todayData(),t=today(),out=new Map();
    const add=(c,why,ic,cls)=>{if(c&&!out.has(c.id))out.set(c.id,{c,why,ic,cls})};
    d.wean.forEach(l=>{const b=litBreeding(l);const od=diffDays(weanBy(l),t);add(b&&byId('cages',b.cage),od>0?`${od} d late`:od===0?'Wean today':`Wean in ${-od} d`,'🍼',od>=0?'late':'')});
    d.counts.forEach(l=>{const b=litBreeding(l);add(b&&byId('cages',b.cage),'Count pups','🥚','')});
    openReq().forEach(r=>(r.mice||[]).map(x=>byId('mice',x)).filter(m=>m&&isLive(m)).forEach(m=>add(byId('cages',m.cage),r.purpose==='bmdm'?'BMDM':'Request','🎯','')));
    marked().forEach(c=>add(c,'Marked','🏷️',''));

  window.pairFrom=id=>{const m=byId('mice',id);if(!m)return;pairPicker(m.sex==='M'?{male:id}:{females:[id]})};
  window.pairCage=cid=>{const ms=liveIn(cid);const M=ms.find(m=>m.sex==='M'&&!inBr(m.id));const F=ms.filter(m=>m.sex==='F'&&!inBr(m.id)).slice(0,2).map(m=>m.id);pairPicker({male:M?.id,females:F})};
  window.replaceParent=(bid,side)=>{const b=byId('breedings',bid);if(!b)return;fresh('replace',{bid,side,fate:'stay',to:'',oldF:(b.females||[])[0]||''});P.tab=side;P.f[side].strain=b.strain&&side==='M'?'':'';draw()};
  {const _bf=breedForm;breedForm=function(id,preset){if(!id&&!window._PPOK&&!window._MMGO&&canEdit())return pairPicker(preset||{});window._PPOK=false;window._MMGO=true;return _bf(id,preset)}}
  {const _md=mouseDetail;mouseDetail=function(id,tab){_md(id,tab);try{const m=byId('mice',id);if(!m||!canEdit()||!isLive(m)||!/^[MF]$/.test(m.sex))return;const a=document.querySelector('#modal .acts');
    if(a&&!a.querySelector('.pp-b'))a.insertAdjacentHTML('afterbegin',`<button class="btn sm pp-b" onclick="closeModal();pairFrom('${id}')">💞 Pair</button>`)}catch(e){}}}
  {const _bd=breedDetail;breedDetail=function(id){_bd(id);try{const b=byId('breedings',id);if(!b||!canEdit()||b.status==='retired')return;const a=document.querySelector('#modal .acts');
    if(a&&!a.querySelector('.pp-rb'))a.insertAdjacentHTML('afterbegin',`<button class="btn sm pp-rb" onclick="replaceParent('${id}','M')">🔁 Replace male</button>${(b.females||[]).length?`<button class="btn sm pp-rb" onclick="replaceParent('${id}','F')">🔁 Replace female</button>`:''}`)}catch(e){}}}
  {const _c=cdrHtml;cdrHtml=function(c){let h=_c(c);if(!canEdit()||!liveIn(c.id).some(m=>m.sex==='M'||m.sex==='F'))return h;
    return h.replace(/(<div class="cdr-a">)/,`$1<button class="btn sm" onclick="pairCage('${c.id}')">💞 Pair</button>`)}}
})();

boot();
</script>
</body>
</html>
