<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#162033">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Colony">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Koelony</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b5bdb'/%3E%3Ccircle cx='10' cy='11' r='4' fill='%23fff'/%3E%3Ccircle cx='22' cy='11' r='4' fill='%23fff'/%3E%3Cellipse cx='16' cy='19' rx='8' ry='7' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{--bg:#f3f5f9;--panel:#fff;--ink:#1b2333;--mute:#687389;--line:#e2e6ee;--pri:#3b5bdb;--pri2:#eaefff;--side:#162033;--sideInk:#b9c3d8;--ok:#2b8a3e;--okb:#ebfbee;--warn:#d9480f;--warnb:#fff4e6;--bad:#c92a2a;--badb:#fff5f5;--m:#1c7ed6;--f:#d6336c;--r:12px;--sh:0 1px 2px rgba(16,24,40,.05),0 2px 6px rgba(16,24,40,.06)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri)}
.hide{display:none!important}
#app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
#side{background:var(--side);color:var(--sideInk);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:18px 18px 14px;color:#fff;font-weight:700;font-size:15px}
.brand small{display:block;font-weight:400;color:var(--sideInk);font-size:12px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--pri);display:grid;place-items:center;flex:none}
#nav{flex:1;padding:6px 10px;overflow:auto}
#nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;color:var(--sideInk);padding:8px 11px;border-radius:8px;cursor:pointer;text-align:left;font-size:14px}
#nav button:hover{background:rgba(255,255,255,.06);color:#fff}
#nav button.on{background:rgba(91,124,250,.22);color:#fff}
#nav svg{width:18px;height:18px;flex:none}
#nav .badge{margin-left:auto;background:var(--warn);color:#fff;border-radius:10px;font-size:11px;padding:0 7px;line-height:18px}
#nav .sep{height:1px;background:rgba(255,255,255,.08);margin:8px 6px}
.who{padding:12px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:13px}
.who b{color:#fff}
.who button{background:none;border:0;color:var(--sideInk);cursor:pointer;padding:4px 0;margin-right:12px;text-decoration:underline}
#main{padding:24px 28px 60px;min-width:0}
.ph{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.ph h1{margin:0;font-size:22px;letter-spacing:-.01em}
.ph p{margin:2px 0 0;color:var(--mute)}
.ph .sp{flex:1}
.crumb{font-size:12.5px;color:var(--mute);margin-bottom:4px}
.mode{font-size:12px;border-radius:20px;padding:2px 10px;font-weight:600}
.mode.live{background:var(--okb);color:var(--ok)}.mode.demo{background:var(--warnb);color:var(--warn)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--line3)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:#f2c4c4}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px}
.card h3 small{color:var(--mute);font-weight:400}
.card h3 .sp{flex:1}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g32{grid-template-columns:3fr 2fr}
.mb{margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 16px;box-shadow:var(--sh);cursor:pointer}
.kpi:hover{border-color:var(--line3)}
.kpi .l{color:var(--mute);font-size:12.5px}
.kpi .v{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.kpi .s{font-size:12.5px;color:var(--mute)}
.kpi.alert .v{color:var(--warn)}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.mini div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.mini b{font-size:18px}
.chip{display:inline-block;border-radius:20px;padding:1px 9px;font-size:12px;font-weight:600;background:var(--soft);color:var(--ink2);white-space:nowrap}
.c-ok{background:var(--okb);color:var(--ok)}.c-warn{background:var(--warnb);color:var(--warn)}.c-bad{background:var(--badb);color:var(--bad)}.c-pri{background:var(--pri2);color:var(--pri)}
.sex{font-weight:700}.sex.M{color:var(--m)}.sex.F{color:var(--f)}.sex.U{color:var(--mute)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle;flex:none}
.sq{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:6px;vertical-align:-2px}
.mute{color:var(--mute)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.filters select,.filters input[type=text],.filters input:not([type]),.fld input,.fld select,.fld textarea,.bulk select,.bulk input,.inp{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--panel);min-width:0}
.filters label.tg{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--ink2);white-space:nowrap}
.search{flex:1;min-width:180px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel);flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--pri2);color:var(--pri);font-weight:600}
.seg button b{font-weight:700;margin-right:4px}
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{position:sticky;top:0;background:var(--soft);text-align:left;font-weight:600;color:var(--ink2);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--hover)}
.tbl tr.grp td{background:var(--soft);font-weight:600;cursor:default}
.tbl tr.sel td{background:var(--pri2)}
.tbl tr:last-child td{border-bottom:0}
.tbl td.wrap{white-space:normal;max-width:260px}
.bulk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--pri2);border-radius:10px;padding:8px 12px;margin-bottom:10px}
.bulk:empty{display:none}
.empty{padding:34px;text-align:center;color:var(--mute)}
/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.ccard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh);border-left:5px solid var(--line3)}
.ccard .h{display:flex;align-items:center;gap:8px}
.ccard .h b{font-size:15px;cursor:pointer}
.ccard .h b:hover{color:var(--pri)}
.ccard .sub{font-size:12.5px;color:var(--mute);margin-top:2px}
.ptbl{width:100%;border-collapse:collapse;font-size:12.5px;margin:10px 0 4px}
.ptbl th{color:var(--mute);font-weight:500;text-align:left;padding:3px 4px;border-bottom:1px solid var(--line2)}
.ptbl td{padding:4px;border-bottom:1px solid var(--line2)}
.ptbl tr:last-child td{border-bottom:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin:8px 0}
.stats div{background:var(--soft);border:1px solid var(--line2);border-radius:8px;padding:6px 2px}
.stats b{display:block;font-size:17px}
.stats span{font-size:11.5px;color:var(--mute)}
.stats a{color:inherit;text-decoration:none}
.lrow{display:flex;justify-content:space-between;font-size:13px;padding:2px 0}
.lrow span:first-child{color:var(--mute)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
/* cage tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.tile{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 8px 12px;cursor:pointer;min-height:62px;overflow:hidden;font-size:12.5px;user-select:none}
.tile:hover{border-color:var(--line3)}
.tile b{font-size:12.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .heart{color:var(--f);font-size:12px;position:absolute;right:6px;top:5px}
.tile .ta{position:absolute;right:6px;bottom:9px;font-size:11px;color:var(--mute)}
.tile i{position:absolute;left:0;right:0;bottom:0;height:7px}
.tile.over,.dz.over{outline:2px dashed var(--pri);outline-offset:2px}
.racks{display:flex;flex-wrap:wrap;gap:14px;padding-bottom:6px}.racks>.rack{flex:1 1 260px;min-width:0}.racks>.rack.gridded{flex-basis:100%}
.rgrid{display:grid;gap:6px;overflow-x:auto;padding:2px 2px 6px}.rgrid .rh{font-size:11px;color:var(--mute);text-align:center;font-weight:600;align-self:center}
.slot{min-height:62px;border-radius:8px;position:relative}.slot.empty{border:1.5px dashed var(--line3);display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:11.5px;cursor:pointer;background:transparent}.slot.empty:hover{border-color:var(--pri);color:var(--pri)}
.slot .tile{height:100%;box-sizing:border-box}.slot .sl{position:absolute;left:6px;bottom:9px;font-size:10px;color:var(--mute);pointer-events:none}.rack h4 .rbtn{margin-left:6px}
.rack{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:120px}
.rack h4{margin:0 0 8px;display:flex;justify-content:space-between;font-size:13px}
.staging{background:var(--panel);border:2px dashed var(--line3);border-radius:12px;padding:12px;margin-bottom:16px}
.staging p{margin:0 0 8px;color:var(--mute);font-size:12.5px}
.bench{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,260px);gap:14px;overflow:auto;padding-bottom:8px}
.bcol{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:260px;display:flex;flex-direction:column;gap:6px}
.bcol .hd{display:flex;align-items:center;gap:6px;font-weight:700}
.bcol .hd .x{margin-left:auto}
.mrow{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12.5px;background:var(--soft);cursor:grab}
.mrow:active{cursor:grabbing}
.mrow .g{margin-left:auto}
/* charts */
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:120px 1fr 40px;gap:8px;align-items:center;font-size:13px}
.bar .tr{background:var(--line2);border-radius:5px;height:14px;overflow:hidden;display:flex}
.bar .tr i{display:block;height:100%}
.bar .n{text-align:right;font-weight:600}
.bar .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:10px}
.cols{display:flex;align-items:flex-end;gap:8px;height:140px;padding-top:10px}
.cols div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;min-width:0}
.cols i{display:block;width:100%;max-width:42px;background:var(--pri);border-radius:6px 6px 0 0;min-height:2px}
.cols span{color:var(--mute);margin-top:5px;white-space:nowrap;font-size:11px}
.cols b{font-size:12px;margin-bottom:3px}
/* tasks */
.tlist{display:flex;flex-direction:column;gap:8px}
.task{border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:9px;padding:9px 12px;background:var(--panel)}
.task.overdue{border-left-color:var(--bad)}.task.soon{border-left-color:#f59f00}.task.done{border-left-color:var(--ok);opacity:.75}
.task .tt{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.task .tt b{color:var(--pri);cursor:pointer}
.task .tt .sp{flex:1}
.task p{margin:4px 0;font-size:13px;color:var(--ink2)}
.task .ft{display:flex;gap:10px;align-items:center;font-size:12.5px;flex-wrap:wrap}
.task .ft .sp{flex:1}
.al{display:flex;gap:10px;align-items:center;padding:9px 11px;border-radius:9px;background:var(--soft);font-size:13.5px;margin-bottom:8px}
.al .ic{width:8px;height:8px;border-radius:50%;flex:none}
.al.bad .ic{background:var(--bad)}.al.warn .ic{background:#f59f00}.al.info .ic{background:var(--pri)}.al.ok .ic{background:var(--ok)}
.al div{flex:1}
.log{display:flex;flex-direction:column}
.log div{padding:8px 0;border-bottom:1px solid var(--line2);font-size:13.5px}
.log small{color:var(--mute)}
/* modal */
#modal{position:fixed;inset:0;background:rgba(15,22,38,.45);display:none;align-items:flex-start;justify-content:center;padding:4vh 14px;z-index:50;overflow:auto}
#modal.open{display:flex}
.box{background:var(--panel);border-radius:14px;width:100%;max-width:640px;padding:20px 22px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.box.wide{max-width:920px}
.mh{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.mh h3{margin:0;font-size:18px;flex:1}
.x{border:0;background:var(--soft);border-radius:8px;width:32px;height:32px;font-size:20px;cursor:pointer;line-height:1;flex:none}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px 14px}
.full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px}
.fld>span{font-weight:600;color:var(--ink2)}
.fld small{color:var(--mute)}
.fld.chk{flex-direction:row;align-items:center;gap:8px}
.multi{display:flex;flex-wrap:wrap;gap:6px 14px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-height:160px;overflow:auto}
.multi label{display:flex;gap:5px;align-items:center;font-size:13px}
.mf{display:flex;gap:8px;align-items:center;margin-top:6px}
.mf .sp{flex:1}
.note{margin:0;background:var(--pri2);color:var(--noteInk);border-radius:8px;padding:8px 11px;font-size:13px}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.kv>div{background:var(--soft);border-radius:8px;padding:8px 10px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.kv>div>span:first-child{display:block;font-size:11.5px;color:var(--mute)}
.ped{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:center;margin:6px 0 14px}
.ped .col{display:flex;flex-direction:column;gap:8px;justify-content:center}
.pnode{border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12.5px;background:var(--panel);cursor:pointer}
.pnode small{display:block;color:var(--mute)}
.pnode.self{border-color:var(--pri);background:var(--pri2);cursor:default}
.pnode.none{color:var(--line3);border-style:dashed;cursor:default}
h4{margin:14px 0 8px;font-size:13.5px;color:var(--ink2)}
.mtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 14px}
.mtabs button{border:0;background:none;padding:8px 12px;cursor:pointer;border-bottom:2px solid transparent;color:var(--mute)}
.mtabs button.on{color:var(--pri);border-bottom-color:var(--pri);font-weight:600}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(1200px 600px at 20% -10%,#dfe6ff,transparent),var(--bg)}
.lbox{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:0 10px 30px rgba(20,30,60,.08)}
.lbox h2{margin:14px 0 4px}
.lbox p{color:var(--mute);margin:0 0 18px}
.lbox .fld{margin-bottom:12px}
.lbox .btn{width:100%;padding:10px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-bottom:6px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1b2333;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.on{opacity:1}#toast.bad{background:var(--bad)}
body.viewer .ed{display:none!important}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.g3,.g4{grid-template-columns:1fr 1fr}.mini{grid-template-columns:repeat(2,1fr)}}
@media (max-width:820px){
 #app{grid-template-columns:1fr}
 #side{position:sticky;top:0;height:auto;z-index:20;flex-direction:row;align-items:center;flex-wrap:wrap}
 .brand{padding:10px 14px}
 #nav{display:flex;order:3;width:100%;overflow-x:auto;padding:0 8px 8px;gap:2px}
 #nav .sep{display:none}
 #nav button{width:auto;flex:none;padding:7px 10px}
 #nav button span.t{display:none}
 #nav button.on span.t{display:inline}
 .who{border:0;margin-left:auto;padding:8px 14px}
 .who .nm{display:none}
 #main{padding:16px 14px 50px}
 .g2,.g3,.g4,.g32,.grid2{grid-template-columns:minmax(0,1fr)}
 .kv{grid-template-columns:1fr 1fr}
 .ped{grid-template-columns:1fr}
 .cards{grid-template-columns:1fr}
}
@media print{#side,.ph .btn,.filters,.bulk{display:none!important}#app{display:block}}
/* ===== v3: theme tokens ===== */
:root{--line2:#eef0f5;--line3:#c6cdda;--soft:#f8f9fc;--hover:#f7f9ff;--ink2:#4a556b;--noteInk:#2b3f91;--tabs:#fff;--tabh:64px}
:root[data-theme=dark]{--bg:#0e131b;--panel:#171e2a;--ink:#e4e9f2;--mute:#93a0b7;--line:#283244;--line2:#202a39;--line3:#3a4659;--soft:#1c2533;--hover:#1e2a3c;--ink2:#c2cad9;
 --pri:#6d8bff;--pri2:#24315c;--side:#0a0f17;--sideInk:#9fabc2;--ok:#5bd17a;--okb:#132e1d;--warn:#ff9a3d;--warnb:#3a240f;--bad:#ff6b6b;--badb:#3a1717;--noteInk:#c3cdff;--tabs:#121925;
 --sh:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}
:root[data-theme=dark] #login{background:var(--bg)}
:root[data-theme=dark] .tile i{opacity:.85}
:root[data-theme=dark] img.qr{background:#fff;padding:4px;border-radius:6px}
/* ===== v3: shared new bits ===== */
#mtop,#tabs{display:none}
#fab{position:fixed;right:22px;bottom:22px;width:56px;height:56px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(30,50,120,.35);cursor:pointer;z-index:30;display:grid;place-items:center}
#fab:active{transform:scale(.96)}
#sheet{position:fixed;inset:0;z-index:60;display:none}
#sheet.open{display:block}
#sheet .bd{position:absolute;inset:0;background:rgba(10,15,25,.45)}
#sheet .sh{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--panel);border-radius:18px 18px 0 0;padding:8px 14px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.25)}
@media (min-width:821px){#sheet .sh{left:50%;right:auto;width:440px;transform:translateX(-50%);bottom:24px;border-radius:16px}}
#modal .mx{position:sticky;top:0;height:0;display:flex;justify-content:flex-end;z-index:5}#modal .mx .x{margin-top:-6px;margin-right:-4px;width:36px;height:36px;font-size:22px;box-shadow:0 1px 4px rgba(0,0,0,.15)}#modal .mh .x{display:none}#modal .mh{padding-right:44px}

/* ===== motion layer v46 — smooth & subtle ===== */
:root{--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1)}
@keyframes kcUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes kcFade{from{opacity:0}to{opacity:1}}
@keyframes kcPop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes kcSheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes kcSheetD{from{opacity:0;transform:translate(-50%,24px) scale(.97)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes kcFlash{0%{box-shadow:0 0 0 0 rgba(59,91,219,.55);transform:scale(1.06)}60%{box-shadow:0 0 0 8px rgba(59,91,219,0);transform:scale(1)}100%{box-shadow:0 0 0 0 rgba(59,91,219,0)}}
@keyframes kcPulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes kcBounce{0%{transform:translateY(0)}40%{transform:translateY(-4px)}100%{transform:translateY(0)}}
@keyframes kcDot{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
#main.enter .ani{animation:kcUp .24s var(--ease) both;animation-delay:calc(var(--i,0) * 14ms)}
#modal.open{animation:kcFade .18s ease both}
#modal.open .box{animation:kcPop .26s var(--ease) both}
#sheet.open .bd{animation:kcFade .2s ease both}
#sheet.open .sh{animation:kcSheet .3s var(--ease) both}
#sheet.closing .sh{transform:translateY(100%);transition:transform .2s ease-in}
#sheet.closing .bd{opacity:0;transition:opacity .2s}
@media (min-width:821px){#sheet.open .sh{animation:kcSheetD .26s var(--ease) both}#sheet.closing .sh{transform:translate(-50%,24px);opacity:0;transition:all .18s ease-in}}
#toast{transition:opacity .22s,transform .3s var(--spring)!important;transform:translate(-50%,16px)}

.btn,.seg button,#tabs button,#nav button,.slist button,.srow,.qstats div{transition:transform .12s ease,background-color .15s,box-shadow .15s,color .15s}
.btn:active,.seg button:active,.slist button:active,.srow:active,.qstats div:active{transform:scale(.96)}

#tabs button:active svg{transform:scale(.88)}

.lcard,.tsec,.card{transition:transform .15s var(--ease),box-shadow .15s}
.tile.flash{animation:kcFlash 1.1s var(--ease) 2;z-index:2}
.tflags .f-bad{animation:kcDot 1.8s ease-in-out infinite}
.mode.saving,.msync.saving{animation:kcPulse 1s ease-in-out infinite}
.lstep.done{animation:kcPop .3s var(--spring) both}
details.lmore[open] .lcard{animation:kcUp .3s var(--ease) both}

body.fun{--bg:#fff7fb;--panel:#ffffff;--pri:#8b5cf6;--pri2:#f1e9ff;--line:#f1dcea;--side:#2a1b4a;--sideInk:#e6dcff;--r:18px;
  background:radial-gradient(1200px 600px at 10% -10%,#ffe3f1 0,transparent 60%),radial-gradient(900px 500px at 110% 10%,#dff0ff 0,transparent 55%),radial-gradient(800px 600px at 50% 120%,#fff3cf 0,transparent 60%),#fff7fb!important;
  font-family:"Nunito","Quicksand",ui-rounded,"SF Pro Rounded",system-ui,sans-serif}
html[data-theme=dark] body[data-skin=cute]{--bg:#1c1530;--panel:#271d40;--line:#3b2d5c;
  background:radial-gradient(1000px 500px at 0 -10%,#3a1f4f 0,transparent 60%),radial-gradient(900px 500px at 110% 10%,#1d2e55 0,transparent 55%),#1c1530!important}
html[data-theme=dark] body[data-skin=cute] .qstats div,html[data-theme=dark] body[data-skin=cute] .lcard,html[data-theme=dark] body[data-skin=cute] .fun-hero{background:var(--panel)!important}
html[data-theme=dark] body[data-skin=cute] .qstats b,html[data-theme=dark] body[data-skin=cute] .fun-hero b{color:#e6dcff}
html[data-theme=dark] body[data-skin=cute] #tabs{background:rgba(39,29,64,.92)}
body.fun #side,body.fun aside{background:linear-gradient(180deg,#3b1f6b,#5b2a86 55%,#7a2f7f)!important}
body.fun #nav button.on{background:linear-gradient(90deg,#ff8fb7,#b388ff)!important;color:#fff!important;box-shadow:0 4px 14px rgba(179,136,255,.45)}
body.fun #nav button{border-radius:14px}
body.fun .ph h1{background:linear-gradient(90deg,#ff5c9a,#8b5cf6 50%,#3fa2ff);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900;letter-spacing:-.02em}
body.fun .card,body.fun .tsec,body.fun .qstats div,body.fun .lcard,body.fun .rack{border-radius:20px;border-color:transparent;box-shadow:0 6px 20px rgba(139,92,246,.10),0 1px 3px rgba(255,92,154,.08)}
body.fun .btn{border-radius:999px}
body.fun .btn.pri{background:linear-gradient(90deg,#ff6fa5,#8b5cf6);border:0;color:#fff;box-shadow:0 6px 16px rgba(139,92,246,.35)}
body.fun .btn.pri:hover{filter:brightness(1.06)}
body.fun .qstats div:nth-child(1){background:linear-gradient(135deg,#ffe0ee,#fff)}body.fun .qstats div:nth-child(2){background:linear-gradient(135deg,#dff0ff,#fff)}
body.fun .qstats div:nth-child(3){background:linear-gradient(135deg,#efe5ff,#fff)}body.fun .qstats div:nth-child(4){background:linear-gradient(135deg,#fff3cf,#fff)}
body.fun .qstats b{font-size:26px;font-weight:900;color:#5b2a86}
body.fun #mtop{background:linear-gradient(90deg,#ff6fa5,#8b5cf6 60%,#3fa2ff)!important}
body.fun #mtop .logo{background:#fff!important;border-radius:12px;display:grid;place-items:center}
body.fun #tabs{background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-top:0;box-shadow:0 -6px 20px rgba(139,92,246,.12)}
body.fun #tabs button.on{color:#8b5cf6}
body.fun #tabs button.on::before{content:"";position:absolute;top:4px;width:44px;height:30px;border-radius:15px;background:linear-gradient(90deg,#ffe0ee,#efe5ff);z-index:-1}
body.fun #tabs button{z-index:0}
body.fun #fab{background:linear-gradient(135deg,#ff6fa5,#8b5cf6)!important;box-shadow:0 10px 24px rgba(139,92,246,.45)}
body.fun .scanbig{border:2px dashed #e2c8ff;background:linear-gradient(90deg,#fff,#faf4ff);border-radius:20px}
body.fun .lcard{border-left-width:0;background:linear-gradient(135deg,#fff,#fff6fa)}
body.fun .lcard.late{background:linear-gradient(135deg,#fff,#ffeef0);box-shadow:0 0 0 2px #ffc2cc,0 6px 18px rgba(255,92,120,.15)}
body.fun .lstep.done{background:#d9f7e6;color:#1d7a46}body.fun .lstep.cur{background:linear-gradient(90deg,#ffe08a,#ffc3a0);color:#7a3d00}
body.fun .chip{border-radius:999px}
body.fun .tile{border-radius:14px;border:0;box-shadow:0 3px 10px rgba(139,92,246,.12)}
body.fun .tile i{height:5px;border-radius:0 0 14px 14px}
body.fun .slot{border-radius:14px}
body.fun .mode.live{background:#d9f7e6;color:#1d7a46}
/* the mouse */
.mz{display:inline-block;vertical-align:middle;overflow:visible}
.mz .mz-tail{transform-origin:8px 34px;animation:mzTail 1.6s ease-in-out infinite}
@keyframes mzTail{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
.mz.mini{margin-right:-5px}.mz.mini .mz-tail{animation:none}
.fz{display:inline-flex;align-items:center}.fz-row{display:inline-flex;vertical-align:middle;margin-left:4px}
body.fun .tile .fz .mz{width:17px;height:13px}
/* hero */
.fun-hero{display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,#ffe0ee,#efe5ff 50%,#dff0ff);border-radius:22px;padding:12px 14px;margin-bottom:12px;box-shadow:0 6px 20px rgba(139,92,246,.12)}
.fun-hero b{display:block;font-size:17px;color:#4b2475}.fun-hero span{font-size:13px;color:#6d5a8a}
.fun-hero-m{display:flex;align-items:flex-end;flex-shrink:0}.fun-hero-m .mz:first-child{animation:mzBob 2.2s ease-in-out infinite}.fun-hero-m .mz:last-child{margin-left:-8px;animation:mzBob 2.2s .4s ease-in-out infinite}
.fun-play{margin-left:auto;flex-shrink:0}
@keyframes mzBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
/* running mouse, peeking mouse, confetti */
.fun-cv{position:fixed;inset:0;pointer-events:none;z-index:300}
.fun-run{position:fixed;bottom:calc(var(--tabh,0px) + 14px);left:-70px;z-index:250;pointer-events:none;animation:funRun 2.2s cubic-bezier(.4,.1,.6,.9) forwards}
.fun-run .mz{animation:mzHop .22s ease-in-out infinite}
@keyframes funRun{to{left:calc(100vw + 70px)}}
@keyframes mzHop{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
#funPeek{position:fixed;right:84px;bottom:calc(var(--tabh,0px) - 8px);z-index:27;cursor:pointer;transition:transform .3s;transform:translateY(22px)}
#funPeek:hover{transform:translateY(8px)}
#funPeek.hop{animation:peekHop .6s cubic-bezier(.3,1.6,.6,1)}
@keyframes peekHop{0%{transform:translateY(22px)}40%{transform:translateY(-30px) rotate(-8deg)}100%{transform:translateY(22px)}}
@media (max-width:820px){#funPeek{right:16px;bottom:calc(var(--tabh,56px) + env(safe-area-inset-bottom) - 10px)}}
/* weaning playground */
#fw{position:fixed;inset:0;z-index:200;background:rgba(43,27,74,.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:12px;opacity:0;transition:opacity .25s}
#fw.on{opacity:1}
.fw-box{background:linear-gradient(160deg,#fff,#fff6fb);border-radius:26px;width:min(860px,100%);max-height:94vh;overflow:auto;padding:14px 16px;box-shadow:0 30px 60px rgba(43,27,74,.35);transform:scale(.94);transition:transform .35s cubic-bezier(.3,1.5,.6,1)}
#fw.on .fw-box{transform:none}
.fw-h{display:flex;align-items:flex-start;gap:10px}.fw-h b{display:block;font-size:20px;color:#5b2a86}.fw-h span{font-size:13px;color:#7a6a92}.fw-h .x{margin-left:auto}
.fw-stage{display:grid;grid-template-columns:1fr 40px 1.2fr;gap:10px;margin:12px 0;align-items:start}
.fw-arrow{pointer-events:none;justify-self:center;width:max-content;align-self:center;font-size:28px;color:#c9a8ff;text-align:center;animation:mzBob 1.4s ease-in-out infinite}
.fw-nest{background:repeating-linear-gradient(45deg,#fff3d6,#fff3d6 10px,#ffeac0 10px,#ffeac0 20px);border-radius:22px;padding:10px;min-height:180px;box-shadow:inset 0 0 0 3px #ffd98a}
.fw-lbl{font-weight:800;color:#8a5a00;margin-bottom:6px}.fw-lbl small{font-weight:400;opacity:.7}
.fw-pups{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.fw-pup{display:flex;flex-direction:column;align-items:center;cursor:grab;touch-action:none;user-select:none;animation:mzBob 1.8s var(--d,0s) ease-in-out infinite;padding:2px}
.fw-pup i.fw-new{background:#fff3bf}.fw-pup i{font-style:normal;font-size:11px;font-weight:800;background:#fff;border-radius:8px;padding:0 5px;margin-top:-2px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.fw-pup.drag{position:fixed;z-index:400;animation:none;cursor:grabbing;transform:scale(1.15) rotate(-6deg);filter:drop-shadow(0 10px 12px rgba(0,0,0,.25));pointer-events:none}
.fw-pup.in{animation:none;cursor:default}.fw-pup.in .mz{width:34px;height:27px}
.fw-cages{display:grid;gap:10px}
.fw-cage{border-radius:20px;padding:8px 10px;min-height:86px;background:#fff;box-shadow:0 0 0 3px #eadcff;transition:box-shadow .2s,transform .2s}
.fw-cage.F{box-shadow:0 0 0 3px #ffc2da;background:linear-gradient(135deg,#fff,#fff0f6)}.fw-cage.M{box-shadow:0 0 0 3px #bfe0ff;background:linear-gradient(135deg,#fff,#eef7ff)}
.fw-cage.hov{transform:scale(1.04);box-shadow:0 0 0 4px #8b5cf6,0 10px 24px rgba(139,92,246,.3)}
.fw-cage.fly{transition:transform .5s cubic-bezier(.5,-.4,.7,1),opacity .5s;transform:translateX(60px) scale(.9);opacity:.2}
.fw-cl b{font-size:15px}.fw-cl span{display:block;font-size:12px;color:#7a6a92}.fw-cl em{font-style:normal;font-weight:800;color:#5b2a86}
.fw-in{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;min-height:40px}
.fw-f{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.fw-score{font-weight:800;color:#5b2a86}
.fw-ready{animation:fwReady 1s ease-in-out infinite}
@keyframes fwReady{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@media (max-width:640px){.fw-stage{grid-template-columns:1fr}.fw-arrow{transform:rotate(90deg);animation:none;margin:-4px 0}}
/* games */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.game-card{border-radius:24px;padding:16px;cursor:pointer;color:#3b2161;box-shadow:0 8px 22px rgba(139,92,246,.15);transition:transform .2s cubic-bezier(.3,1.5,.6,1)}
.game-card:hover{transform:translateY(-4px) rotate(-.5deg)}.game-card:active{transform:scale(.97)}
.game-card.g1{background:linear-gradient(135deg,#dff0ff,#efe5ff)}.game-card.g2{background:linear-gradient(135deg,#ffe0ee,#fff3cf)}.game-card.g3{background:linear-gradient(135deg,#d9f7e6,#dff0ff)}.game-card.g4{background:linear-gradient(135deg,#fff3cf,#ffe0ee)}
.game-card .gi{font-size:40px;height:58px;display:flex;align-items:center}.game-card b{display:block;font-size:18px;margin:4px 0}.game-card span{font-size:13px;opacity:.85}.game-card em{display:inline-block;margin-top:10px;font-style:normal;font-weight:800;background:rgba(255,255,255,.7);border-radius:999px;padding:2px 10px;font-size:12.5px}
.gtop{display:flex;gap:14px;font-weight:800;color:#5b2a86;margin-bottom:10px}
.gq{font-size:16px}
.grk{display:grid;gap:4px}.grk button{border:0;border-radius:10px;background:#f4eefc;padding:10px 0;font-weight:700;font-size:12px;color:#6d5a8a;cursor:pointer;min-height:40px;transition:transform .12s,background .2s}
.grk button:active{transform:scale(.92)}.grk button.ok{background:#bdf2d3;color:#1d7a46}.grk button.no{background:#ffc9d2;color:#a3122d;animation:gShake .3s}
@keyframes gShake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.gholes{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;user-select:none;touch-action:manipulation}
.hole{position:relative;height:90px;border-radius:50% 50% 18px 18px/30% 30% 18px 18px;background:linear-gradient(#ffe8b0,#f3c66c);overflow:hidden;box-shadow:inset 0 -10px 0 #d9a443;cursor:pointer}
.hole .pop{position:absolute;left:0;right:0;bottom:-70px;display:flex;justify-content:center;transition:bottom .16s ease-out}
.hole.up .pop{bottom:12px}.hole.hit .pop{transform:scale(.6) rotate(20deg);opacity:.4;transition:all .15s}
.hole .ch{font-size:42px}
.gmem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;perspective:800px}
.mc2{position:relative;height:84px;border:0;background:none;cursor:pointer;transform-style:preserve-3d;transition:transform .4s;padding:0}
.mc2 .fr,.mc2 .bk{position:absolute;inset:0;border-radius:14px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;font-size:11.5px;font-weight:800;padding:4px;text-align:center}
.mc2 .fr{background:linear-gradient(135deg,#efe5ff,#ffe0ee)}.mc2 .bk{background:#fff;transform:rotateY(180deg);box-shadow:inset 0 0 0 4px var(--c);color:#3b2161}
.mc2.flip{transform:rotateY(180deg)}.mc2.got .bk{background:linear-gradient(135deg,#d9f7e6,#fff)}
.gsex{text-align:center}.gsex h2{margin:6px 0 0;font-size:30px;color:#5b2a86}.gsm{height:90px}
.gbtns{display:flex;gap:12px;justify-content:center;margin-top:14px}.gbtns .btn{font-size:18px;padding:12px 26px;border-radius:999px}
.gF{background:#ffe0ee!important;color:#c2185b!important}.gM{background:#dff0ff!important;color:#1565c0!important}
.gbtns .ok{box-shadow:0 0 0 4px #7bdcb5}.gbtns .no{box-shadow:0 0 0 4px #ff8a9a;animation:gShake .3s}
.gover{text-align:center;padding:10px}.gover h2{font-size:28px;color:#5b2a86;margin:8px 0}
@media (max-width:520px){.gholes{grid-template-columns:repeat(3,1fr)}.gmem{grid-template-columns:repeat(3,1fr)}}

/* ===================== THEMES (skins) v48 ===================== */
#amb{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
body[data-skin]:not([data-skin=classic]){background:var(--sky,var(--bg))!important}
body.fun{--g1:#ff5c9a;--g2:#8b5cf6;--g3:#3fa2ff;--hero1:#ffe0ee;--hero2:#efe5ff;--hero3:#dff0ff;--heroInk:#4b2475;--glow:rgba(139,92,246,.35);--sideBg:linear-gradient(180deg,#3b1f6b,#5b2a86 55%,#7a2f7f);--acc:#8b5cf6;--panelA:var(--panel)}
body.fun[data-skin] .ph h1{background:linear-gradient(90deg,var(--g1),var(--g2) 50%,var(--g3));-webkit-background-clip:text;background-clip:text;color:transparent}

body.fun[data-skin] #nav button.on{background:linear-gradient(90deg,var(--g1),var(--g2))!important;box-shadow:0 4px 14px var(--glow)}
body.fun[data-skin] .btn.pri{background:linear-gradient(90deg,var(--g1),var(--g2));box-shadow:0 6px 16px var(--glow)}
body.fun[data-skin] #mtop{background:linear-gradient(90deg,var(--g1),var(--g2) 60%,var(--g3))!important}
body.fun[data-skin] #fab{background:linear-gradient(135deg,var(--g1),var(--g2))!important;box-shadow:0 10px 24px var(--glow)}
body.fun[data-skin] #tabs button.on{color:var(--acc)}
body.fun[data-skin] #tabs button.on::before{background:var(--hero2)}
body.fun[data-skin] .fun-hero{background:linear-gradient(120deg,var(--hero1),var(--hero2) 50%,var(--hero3))}
body.fun[data-skin] .fun-hero b{color:var(--heroInk)}body.fun[data-skin] .fun-hero span{color:var(--heroInk);opacity:.75}
body.fun[data-skin] .qstats div{background:var(--panelA)!important}
body.fun[data-skin] .qstats b{color:var(--heroInk)}
body.fun[data-skin] .card,body.fun[data-skin] .tsec,body.fun[data-skin] .lcard,body.fun[data-skin] .rack,body.fun[data-skin] .tile{background:var(--panelA)}
body.fun[data-skin] .card,body.fun[data-skin] .tsec,body.fun[data-skin] .qstats div,body.fun[data-skin] .lcard,body.fun[data-skin] .rack{box-shadow:0 6px 20px var(--glow)}

/* ---------- theme picker ---------- */
body.fun[data-skin] .scanbig{background:var(--panelA);color:var(--ink);border-color:var(--line3,var(--line))}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.skin{position:relative;border:0;border-radius:18px;height:112px;cursor:pointer;overflow:hidden;text-align:left;padding:10px 12px;color:#fff;font:inherit;box-shadow:0 4px 14px rgba(0,0,0,.15);transition:transform .2s cubic-bezier(.3,1.5,.6,1)}
.skin:hover{transform:translateY(-3px)}.skin:active{transform:scale(.96)}
.skin b{position:relative;z-index:2;display:block;font-size:15px;text-shadow:0 1px 3px rgba(0,0,0,.35)}.skin small{position:relative;z-index:2;font-size:11.5px;opacity:.95;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.skin .em{position:absolute;right:8px;bottom:4px;font-size:34px;z-index:2;animation:mzBob 2.4s ease-in-out infinite}
.skin.on{box-shadow:0 0 0 3px #fff,0 0 0 6px #8b5cf6}
.skin.on::after{content:"✓";position:absolute;top:8px;right:10px;background:#fff;color:#8b5cf6;border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-weight:900;z-index:3}
.sk-classic{background:linear-gradient(135deg,#162033,#3b5bdb)}
.sk-cute{background:linear-gradient(135deg,#ff8fb7,#b388ff 60%,#6cb8ff)}
.sk-future{background:linear-gradient(135deg,#05030f,#1a0b3d);box-shadow:inset 0 0 0 1px #3df5ff55}
.sk-future::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 14px,#3df5ff33 14px 15px),repeating-linear-gradient(90deg,transparent 0 14px,#ff3df233 14px 15px);animation:skGridMove 3s linear infinite}
.sk-vintage{background:linear-gradient(135deg,#d9c39a,#8b6a43);color:#2b1d0e}.sk-vintage b,.sk-vintage small{text-shadow:none;font-family:"Special Elite","Courier New",monospace}
.sk-bw{background:linear-gradient(135deg,#fff 0 50%,#111 50%)}.sk-bw b{color:#111;text-shadow:0 0 2px #fff}.sk-bw small{color:#fff}
.sk-space{background:radial-gradient(circle at 75% 30%,#3b2a7a,#0a0820 60%)}
.sk-space::before{content:"";position:absolute;inset:0;background-image:radial-gradient(1px 1px at 20% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 60% 70%,#fff,transparent),radial-gradient(1px 1px at 80% 20%,#fff,transparent),radial-gradient(1px 1px at 40% 80%,#fff,transparent),radial-gradient(1.5px 1.5px at 10% 60%,#fff,transparent);animation:skTwk 2s ease-in-out infinite alternate}
.sk-field{background:linear-gradient(180deg,#8fd3ff 0 55%,#7cc95b 55%)}
.sk-desert{background:linear-gradient(180deg,#ffcf8a 0 50%,#e9a65b 50% 70%,#d38b45 70%)}
.sk-ocean{background:linear-gradient(180deg,#5fd0ff,#0b5fa5)}
.sk-candy{background:repeating-linear-gradient(45deg,#ffd6e8 0 12px,#fff 12px 24px)}.sk-candy b,.sk-candy small{color:#a4115c;text-shadow:none}
#skWipe{position:fixed;inset:0;z-index:500;pointer-events:none;clip-path:circle(0 at var(--x) var(--y));transition:clip-path .55s cubic-bezier(.6,0,.3,1)}
#skWipe.go{clip-path:circle(150% at var(--x) var(--y))}

/* ============ FUTURISTIC ============ */
body[data-skin=future]{--bg:#05030f;--sky:#05030f;--panel:rgba(14,10,38,.86);--panelA:rgba(14,10,38,.82);--ink:#dff9ff;--mute:#8aa6c9;--line:#2a2b5c;--line2:#1c1d44;--line3:#3a3b75;--soft:#120d33;--hover:#1a1446;
  --g1:#ff3df2;--g2:#7b5cff;--g3:#3df5ff;--hero1:#14093a;--hero2:#0e1446;--hero3:#06283a;--heroInk:#bff9ff;--glow:rgba(61,245,255,.25);--sideBg:linear-gradient(180deg,#07051a,#120a3a);--acc:#3df5ff;--tabs:rgba(8,6,26,.92);

body[data-skin=future] .btn{border-color:#3df5ff66;text-transform:uppercase;font-size:12.5px;letter-spacing:.06em}
body[data-skin=future] .btn:hover{box-shadow:0 0 12px #3df5ff88}

body[data-skin=future] #tabs button.on svg{filter:drop-shadow(0 0 6px #3df5ff)}
body[data-skin=future] .ph h1{text-shadow:0 0 18px #ff3df255}

/* activity list */

.tile.faded{opacity:var(--fade,1)}

.rstats b{color:var(--ink);margin-right:4px}.rstats .hot{border-color:var(--warn);color:var(--warn)}.rstats .hot b{color:var(--warn)}.rstats .zero b{color:var(--bad)}

/* ===================== PLAY MODE ===================== */
#pl{position:fixed;inset:0;z-index:210;background:rgba(43,27,74,.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:12px;opacity:0;transition:opacity .22s}
#pl.on{opacity:1}#pl.on .fw-box{transform:none}
.pl-box{width:min(900px,100%)}.pl-body{margin:12px 0}
.pl-m{display:inline-flex;flex-direction:column;align-items:center;padding:3px 4px;border-radius:12px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .15s,opacity .3s,background .2s}
.pl-m i{font-style:normal;font-size:11px;font-weight:800;background:#fff;color:#2b2240;border-radius:8px;padding:0 5px;margin-top:-2px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pl-m small{font-size:10px;color:var(--mute);max-width:90px;text-align:center;line-height:1.2;margin-top:2px}
.pl-m.picked{background:color-mix(in srgb,var(--pri) 18%,transparent);transform:scale(1.08)}.pl-m.locked{opacity:.25;pointer-events:none}
.pl-m.fade-out{transition:opacity .45s,transform .45s;opacity:0;transform:translateY(-14px) scale(.8)}
.pl-ghost{transform:scale(1.12) rotate(-5deg);filter:drop-shadow(0 10px 12px rgba(0,0,0,.25))}
.pl-drop{transition:box-shadow .2s,transform .2s}.pl-drop.hov{transform:scale(1.03);box-shadow:0 0 0 4px var(--pri),0 10px 24px rgba(0,0,0,.18)!important}
.pl-acts{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 10px}
/* matchmaker */
.mm-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}.mm-top select{padding:7px 9px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;max-width:60%}
.mm-grid{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:10px}.mm-col h4{margin:0 0 6px}
.pl-pool{display:flex;flex-wrap:wrap;gap:4px;max-height:44vh;overflow:auto;background:var(--soft);border-radius:14px;padding:6px;min-height:80px}
.mm-love{border-radius:22px;padding:10px;text-align:center;background:linear-gradient(160deg,#fff0f6,#f3e8ff);box-shadow:0 0 0 3px #ffc2da;min-height:200px}
.mm-heart{font-size:34px;animation:mzBob 1.6s ease-in-out infinite}.mm-love b{display:block}.mm-love small{color:var(--mute)}
.mm-in{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:8px;min-height:70px}.mm-w{font-size:12px;color:var(--warn);margin-top:4px}
@media (max-width:640px){.mm-grid{grid-template-columns:1fr 1fr}.mm-love{grid-column:1/-1;order:-1;min-height:150px}}
/* trays (retire / end) */
.rt-cage{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:10px;border-radius:18px;background:repeating-linear-gradient(45deg,#fff3d6,#fff3d6 10px,#ffeac0 10px,#ffeac0 20px);box-shadow:inset 0 0 0 3px #ffd98a;min-height:84px}
.rt-trays{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.rt-tray{border-radius:16px;padding:8px;background:var(--soft);text-align:center;min-height:110px;box-shadow:0 0 0 2px var(--line)}
.rt-e{font-size:26px}.rt-tray b{display:block;font-size:13px}.rt-tray small{color:var(--mute);font-size:11px}.rt-in{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;margin-top:4px}.rt-in .pl-m .mz{width:34px;height:27px}
@media (max-width:640px){.rt-trays{grid-template-columns:repeat(2,1fr)}}
.pl-end .rt-cage{background:var(--soft);box-shadow:inset 0 0 0 2px var(--line)}
/* count pups */
.ct-nest{position:relative;min-height:220px;border-radius:24px;background:radial-gradient(circle at 50% 60%,#fff3d6,#ffe1a8 70%,#f3c66c);box-shadow:inset 0 -10px 0 #e0b25a;cursor:pointer;padding:16px;display:flex;align-items:center;justify-content:center}
.ct-pups{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:520px}.ct-p{display:inline-block;animation:mzBob 2s ease-in-out infinite}.ct-p:nth-child(2n){animation-delay:.5s}.ct-p.pop{animation:kcPop .3s var(--spring) both}
.ct-hint{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:12px;color:#8a5a00;opacity:.7;pointer-events:none}
.ct-tot{text-align:center;font-size:17px;margin:10px 0}.ct-tot b{font-size:26px}.ct-btns{display:flex;gap:8px;justify-content:center}
/* litter timeline */
.lt-line{margin:4px 4px 16px}.lt-bar{position:relative;height:8px;border-radius:8px;background:var(--line);margin:22px 12px 30px}.lt-fill{position:absolute;inset:0 auto 0 0;border-radius:8px;background:linear-gradient(90deg,var(--g1,#ff5c9a),var(--g2,#8b5cf6))}
.lt-ms{position:absolute;top:50%;transform:translate(-50%,-50%);text-align:center}.lt-ms i{display:block;width:14px;height:14px;border-radius:50%;background:var(--panel);border:3px solid var(--line3,#999);margin:0 auto}
.lt-ms.done i{border-color:var(--ok);background:var(--ok)}.lt-ms b{position:absolute;top:16px;left:50%;transform:translateX(-50%);font-size:11px;white-space:nowrap}.lt-ms:first-of-type b,.lt-ms:first-of-type small{left:0;transform:none}.lt-ms:last-of-type b,.lt-ms:last-of-type small{left:auto;right:0;transform:none}.lt-ms small{position:absolute;top:30px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--mute)}
.lt-walker{position:absolute;bottom:6px;transform:translateX(-50%)}.lt-walker em{display:block;width:12px;height:12px;border-radius:50%;background:var(--pri);margin-bottom:-2px}.lt-walker .mz{animation:mzHop .5s ease-in-out infinite}
/* split / combine */
.sp-two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sp-cage{border-radius:18px;padding:10px;background:var(--soft);box-shadow:0 0 0 2px var(--line);min-height:200px;position:relative}
.sp-cage b{display:block}.sp-cage small{color:var(--mute);font-size:12px}.sp-cage select{width:100%;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit}
.sp-in{display:flex;flex-wrap:wrap;gap:3px;margin-top:8px;min-height:100px}.sp-n{position:absolute;top:8px;right:10px;font-style:normal;font-weight:800;color:var(--mute)}
/* living rack + workbench */
body.fun .tile.wig{animation:kcWig .45s ease-in-out 2}@keyframes kcWig{25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
.tile .nest{position:absolute;right:22px;bottom:6px;font-size:12px}
body.fun .mrow .mz{vertical-align:middle}
/* peek */
.pk-cage{position:relative;height:340px;border-radius:24px;background:linear-gradient(#eef6ff,#e3f0ff);box-shadow:inset 0 0 0 4px #b9d7f5;overflow:hidden}
.pk-bed{position:absolute;left:0;right:0;bottom:0;height:40%;background:repeating-radial-gradient(circle at 20% 30%,#f5deb3 0 3px,#ecd2a0 3px 6px)}
.pk-m{position:absolute;left:var(--x);top:var(--y);animation:pkWander 7s ease-in-out infinite;animation-delay:calc(var(--d) * -1);cursor:pointer;text-align:center}
@keyframes pkWander{0%,100%{transform:translate(0,0)}25%{transform:translate(30px,10px)}50%{transform:translate(-10px,30px)}75%{transform:translate(-30px,-6px)}}
.pk-tag{display:block;background:#fff;border-radius:8px;padding:1px 6px;font-size:10.5px;color:#2b2240;box-shadow:0 1px 4px rgba(0,0,0,.15);white-space:nowrap}.pk-tag b{margin-right:4px}
.pk-nest{position:absolute;right:16px;bottom:16px;font-size:30px;display:flex;align-items:center}.pk-food{position:absolute;left:14px;top:10px;font-size:26px}.pk-water{position:absolute;right:14px;top:10px;font-size:24px}
/* genotype sorter */
.gs-cards{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;position:sticky;top:0;background:inherit;padding:4px 0;z-index:2}
.gs-card{padding:10px 14px;border-radius:12px;background:var(--panel);box-shadow:0 0 0 2px var(--c),0 4px 10px rgba(0,0,0,.1);font-weight:800;color:var(--c);cursor:grab;touch-action:none;user-select:none}
.gs-mice{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}.gs-m{border-radius:14px;padding:8px;text-align:center;background:var(--soft);box-shadow:0 0 0 2px var(--line);cursor:pointer}
.gs-m b{display:block;font-size:13px}.gs-m.picked{box-shadow:0 0 0 3px var(--pri)}.gs-m.set{background:color-mix(in srgb,var(--ok) 12%,var(--soft))}
/* ear punch */
.ep-wrap{text-align:center}.ep{width:min(300px,80vw)}.ep-ear{cursor:pointer}.ep-ear .h1,.ep-ear .h2{transition:opacity .2s}.ep-ctl{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:8px}.ep-ctl b{display:block;font-size:12.5px;margin-bottom:4px}.ep-ctl .seg button{min-width:52px}.ep-ear:active{transform-origin:center;opacity:.85}.ep-res{font-size:18px;margin-top:6px}
/* daily ring + team */
.dr{display:flex;align-items:center;gap:12px;background:var(--panelA,var(--panel));border-radius:20px;padding:10px 14px;margin-bottom:12px;cursor:pointer;box-shadow:0 6px 20px var(--glow,rgba(0,0,0,.08));color:var(--ink)}
.dr b{display:block;font-size:16px}.dr small{display:block;color:var(--mute);font-size:12.5px}.dr .tb-l{color:var(--pri);font-weight:700}
.tb-row{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--line)}.tb-row.me{background:var(--pri2);border-radius:10px}.tb-r{width:28px;text-align:center;font-size:18px}
.bd-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.bdx{border-radius:14px;padding:10px;text-align:center;background:var(--soft);opacity:.45;filter:grayscale(1)}.bdx.on{opacity:1;filter:none;box-shadow:0 0 0 2px var(--g2,#8b5cf6)}
.bdx span{font-size:26px;display:block}.bdx b{display:block;font-size:12.5px}.bdx small{font-size:10.5px;color:var(--mute)}
/* card flip */
.cf-scene{perspective:1200px;display:flex;justify-content:center;height:calc(300px * var(--k,1) + 10px)}
.cf-card{--k:1;position:relative;width:480px;height:288px;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,1.4,.5,1);cursor:pointer;transform:scale(var(--k));transform-origin:top center}
.cf-card.flip{transform:scale(var(--k)) rotateY(180deg)}.cf-card.printing{transition:transform .6s ease-in,opacity .6s;transform:scale(var(--k)) translateY(260px) rotateX(60deg);opacity:0}
.cf-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:6px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.25);background:#fff;color:#111}
.cf-back{transform:rotateY(180deg);padding:20px;text-align:left}.cf-back b{font-size:22px}
.cf-pdf{width:5in}.cf-pdf>*{margin:0!important}
html[data-theme=dark] .mm-love{background:linear-gradient(160deg,#3a2236,#2c2050)}html[data-theme=dark] .rt-cage:not(.pl-end .rt-cage){background:#3a2e1f}html[data-theme=dark] .pk-cage{background:linear-gradient(#1f2c44,#1a2438)}

/* genotyping list */
.gd-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;background:var(--soft);margin-bottom:6px;cursor:pointer;border-left:4px solid var(--warn)}
.gd-row.late{border-left-color:var(--bad)}.gd-main{flex:1;min-width:0}.gd-main b{display:block}.gd-main small{display:block;color:var(--mute);font-size:12px}
.gd-old summary{cursor:pointer}@media (max-width:640px){.gd-row{flex-wrap:wrap}.gd-b{width:100%;justify-content:flex-start}}.gd-b{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.gd-list{padding:10px!important}

.bio-other{display:flex;align-items:center;gap:8px;padding:10px 8px;border-top:1px solid var(--line);margin-top:6px;flex-wrap:wrap}.bio-other span{font-size:15px;flex:1 1 100%}.bio-other input{flex:1;padding:8px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit}
.slist .qi{width:24px;text-align:center;font-size:18px;flex:none;display:inline-block}

/* wheel date picker */
.wd{position:relative;display:flex;gap:4px;height:180px;flex:1 1 100%;background:var(--soft);border-radius:14px;overflow:hidden;user-select:none;-webkit-user-select:none}
.wd-band{position:absolute;left:6px;right:6px;top:72px;height:36px;border-radius:10px;background:var(--panel);box-shadow:0 1px 4px rgba(0,0,0,.08);pointer-events:none}
.wd-col{position:relative;flex:1;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
.wd-col::-webkit-scrollbar{display:none}.wd-col[data-k=m]{flex:1.2}.wd-pad{height:72px}
.wd-i{height:36px;line-height:36px;text-align:center;scroll-snap-align:start;font-size:17px;color:var(--mute);cursor:pointer;transition:color .15s,transform .15s}
.wd-i.on{color:var(--ink);font-weight:800;transform:scale(1.08)}
.bio-other .wd{margin:2px 0 6px}.bio-other .btn{flex:1 1 100%;padding:10px}

/* ear tags for a cage */
.eb-list{display:grid;gap:6px}.eb-row{display:grid;grid-template-columns:1fr 130px 80px;align-items:center;gap:8px;padding:6px 10px;border-radius:12px;background:var(--soft)}
.eb-row.dup{box-shadow:0 0 0 2px var(--warn)}.eb-who{font-size:15px}.eb-svg{width:120px;height:70px;display:block}.eb-ear{cursor:pointer}.eb-code{font-weight:800;text-align:right}

.earb{display:inline-block;margin-left:4px;padding:0 5px;border-radius:6px;font-size:10.5px;font-weight:800;letter-spacing:.04em;background:var(--pri2);color:var(--pri);vertical-align:1px}
/* ===== Zero typing (v81) ===== */
.zb-hid{display:none!important}
.zb-c{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:6px 1px 3px;-webkit-overflow-scrolling:touch}
.zb-c::-webkit-scrollbar{display:none}
.zb-c button{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:7px 12px;font:inherit;font-size:13.5px;line-height:1.2;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,color .15s,transform .12s}
.zb-c button:active{transform:scale(.94)}
.zb-c button.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
.zb-c button small{display:block;font-size:10.5px;opacity:.75;font-weight:400}
.zb-d{flex-wrap:wrap}
.zb-n{display:flex;align-items:center;gap:12px;padding:3px 0}
.zb-n button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:22px;font-weight:700;line-height:1;cursor:pointer;transition:transform .1s}

/* v119 window Back bar */

/* v120 card colours screen */
.ccx-all{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.ccx-list{display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
.ccx-row,.ccx-prev>*,.ccx-ed{min-width:0;box-sizing:border-box}
.ccx-row{border:1px solid var(--line);border-radius:14px;padding:8px 10px;background:var(--panel)}

.ccx-top{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:4px 0;font:inherit;color:inherit;cursor:pointer;text-align:left;min-height:36px}

.ccx-card>i{position:absolute;left:0;top:0;bottom:0;width:8px}

.ccx-ed{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
.ccx-lab{font-weight:700;font-size:13px;margin:8px 0 5px}.ccx-lab small{font-weight:500;color:var(--mute);margin-left:6px}
.ccx-pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:6px}

.ccx-pal button.on{border-color:var(--ink);box-shadow:inset 0 0 0 2px #fff}
.ccx-own{display:grid;place-items:center;background:var(--soft);border:1.5px dashed var(--line3);font-weight:800;position:relative;overflow:hidden;color:var(--mute)}
.ccx-own input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.ccx-sl{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute)}.ccx-sl span{flex:none;white-space:nowrap}.ccx-sl input{flex:1;min-width:0;accent-color:var(--pri);min-height:32px}
.ccx-qk{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

/* v121 end cage */
.ec-big{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 4px}
.ec-big button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px;border:1.5px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);font:inherit;font-size:20px;cursor:pointer;text-align:left;min-height:84px}

.ec-each{display:grid;gap:6px;max-height:48vh;overflow:auto}.ec-m{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 8px;border:1px solid var(--line);border-radius:12px}
.ec-m>b{min-width:70px}.ec-ch{display:flex;gap:6px;flex-wrap:wrap}.ec-ch select{max-width:170px;font-size:16px}.ec-ch.big button{min-height:48px;font-size:15px}

.ec-tg button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:8px 10px;min-height:56px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.ec-tg button small{font-size:11.5px;color:var(--mute)}.ec-tg button em{font-style:normal;font-size:11.5px;color:var(--warn);font-weight:700}.ec-tg button:hover{border-color:var(--pri)}
.ec-note{background:var(--pri2,#eaefff);border-radius:10px;padding:6px 10px;font-size:13px}.ec-warn{background:var(--warnb,#fff4e6);color:var(--warn);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:600}
.tile.ec-sel{outline:3px solid var(--bad,#c92a2a)!important;outline-offset:1px}
#ecBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:90;display:flex;align-items:center;gap:8px;padding:8px 10px 8px 14px;border-radius:999px;background:var(--panel);box-shadow:0 8px 24px rgba(0,0,0,.25);border:1px solid var(--line);white-space:nowrap}

/* v122 tap safety */
button.danger,.btn.danger{position:relative;overflow:hidden;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
button.danger::before,.btn.danger::before{content:"";position:absolute;inset:0;background:currentColor;opacity:.16;transform:scaleX(0);transform-origin:left;pointer-events:none}
button.danger.holding::before,.btn.danger.holding::before{transform:scaleX(1);transition:transform var(--hold,600ms) linear}
button.danger.holdhint,.btn.danger.holdhint{animation:holdNudge .5s}
@keyframes holdNudge{20%,60%{transform:translateX(-3px)}40%,80%{transform:translateX(3px)}}
@media (pointer:coarse){
 .btn,.slist button,.ec-ch button,.ec-date button,.cdr-a .btn,.mf .btn,.mh .btn,.bulk .btn,#ecBar .btn{min-height:44px}
 .btn.sm{min-height:40px;padding-left:12px;padding-right:12px}
 .cdr-a,.mf,.bulk,.ec-qk,.ccx-qk,.ccx-all{gap:10px!important}
 .mh{gap:8px;flex-wrap:wrap}
 .slist button{margin:2px 0}
}
/* red buttons on their own row, away from everyday buttons */
.cdr-a{display:flex;flex-wrap:wrap}.cdr-a::after{content:"";order:98;flex-basis:100%;height:0}
.cdr-a .btn.danger{order:99}
.mh{flex-wrap:wrap}.mh .ec-btn.danger{order:99;margin-left:0}

.rq-ch button.on{border-color:var(--pri);background:var(--pri2,#eaefff);color:var(--pri);font-weight:700}
.rq-ch input[type=date],.rq-note,.rq-two select{min-height:40px;border:1px solid var(--line);border-radius:10px;padding:0 10px;font-size:16px;background:var(--panel);color:var(--ink)}
.rq-note{width:100%;box-sizing:border-box}.rq-two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.rq-two select{width:100%}
.rq-root h4,.mk-root h4{margin:12px 0 6px}
.rq-step{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;width:max-content}
.rq-step button{width:48px;min-height:44px;border:0;background:none;font-size:22px;color:var(--pri);cursor:pointer}.rq-step b{min-width:36px;text-align:center;font-size:18px}
.rq-tools{display:flex;gap:6px;margin-bottom:6px}
.rq-mice{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;max-height:40vh;overflow:auto}
.rq-m{display:grid;grid-template-columns:auto 1fr;gap:0 8px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.rq-m input{grid-row:1/3;width:20px;height:20px}.rq-m small{color:var(--mute);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rq-m.on{border-color:var(--pri);background:var(--pri2,#eaefff)}
.rq-cage{display:grid;gap:6px;margin:6px 0}
.rq-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:12px;background:#f8f0fc;border:1px solid #e5dbff}
.rq-row.mk{background:var(--soft)}.rq-row.bad{background:#fff0f0;border-color:#ffa8a8}.rq-row.warn{background:#fff4e6;border-color:#ffc078}
.rq-open{flex:1;min-width:0;text-align:left;border:0;background:none;padding:2px 0;font:inherit;color:var(--ink);cursor:pointer}
.rq-open b{display:block}.rq-open small{display:block;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rq-add{display:flex;gap:8px;flex-wrap:wrap}
.rq-today{margin-bottom:12px}.rq-th{display:flex;align-items:center;justify-content:space-between;gap:8px}.rq-th h3{margin:0}.rq-today .rq-row{margin-top:6px}
.rq-st{text-transform:capitalize}.rq-st.reserved{background:#f3d9fa;color:#862e9c}.rq-st.done{background:#d3f9d8;color:#2b8a3e}.rq-st.cancelled{background:#eee;color:#666}
.rq-ml{display:grid;gap:4px}.rq-hist{margin:0;padding-left:18px;font-size:13px}.rq-notep{background:var(--soft);border-radius:10px;padding:8px 10px}

.tile .rqb.bad{background:#c92a2a;color:#fff}.tile .rqb.warn{background:#f08c00;color:#fff}.tile{position:relative}
body.mk-only #main .tile:not(.has-mk){opacity:.18;filter:grayscale(1)}
#mkOnly.on{background:var(--pri);color:#fff;border-color:var(--pri)}

body.fun aside#cdr{background:var(--panel,#fff)!important;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}

.sg-floor{position:absolute;left:-10%;right:-10%;bottom:-60px;height:170px;background:#fff;border-radius:50%;opacity:.8;filter:blur(2px)}
@keyframes sgDrift{from{left:-220px}to{left:110%}}

.sg-av{width:44px;height:44px;border-radius:10px;background:#fff6dc;border:2px solid #4a280c;display:grid;place-items:center;flex:none}
.sg-mid{display:grid;grid-template-columns:1fr 64px;gap:8px;align-items:start}

.sg-wing{position:absolute;top:-17px;left:50%;transform:translateX(-50%);white-space:nowrap;padding:5px 18px;border-radius:22px;background:linear-gradient(#ffe066,#f2a10f);border:3.5px solid #8a4b05;color:#fff;font-size:17px;-webkit-text-stroke:1.2px #6b3a10;paint-order:stroke fill;box-shadow:inset 0 3px 0 #fff2a8}
.sg-screen{background:#1d2c55;border:3.5px solid #8a4b05;border-radius:14px;padding:7px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.sg-cage{position:relative;min-height:96px;border-radius:10px;background:#fffaf0;border:2px solid #0f1836;padding:19px 3px 5px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:1px;font:inherit;color:#3a2410;cursor:pointer;overflow:hidden}

.sg-cage.late{box-shadow:0 0 0 2px #ff4d4d inset}
.sg-band{position:absolute;top:0;left:0;right:0;height:17px;color:#fff;font-weight:700;font-size:11px;line-height:17px;text-align:center;text-shadow:0 1px 1px rgba(0,0,0,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.sg-ic{position:absolute;top:19px;right:3px;font-size:13px}
.sg-ms{display:flex;min-height:22px}.sg-ms i{font-size:10px;color:#9a8a70}

.sg-tidy{grid-column:1/-1;color:#fff;text-align:center;padding:26px 6px;font-weight:700;font-size:16px}

.sg-side{display:flex;flex-direction:column;gap:13px;padding-top:4px}
.sg-bub{position:relative;width:58px;height:58px;border-radius:50%;border:3px solid #7a2a10;background:radial-gradient(circle at 40% 35%,#fff,var(--bb) 70%);box-shadow:inset 0 -5px 0 rgba(0,0,0,.15),inset 0 4px 0 rgba(255,255,255,.5),0 3px 0 #7a2a10;font-size:25px;display:grid;place-items:center;cursor:pointer;padding:0}

.sg-dot{position:absolute;top:-7px;right:-7px;min-width:22px;height:22px;padding:0 4px;border-radius:11px;background:#e5302a;border:2px solid #fff;color:#fff;font:700 12px/18px Fredoka,system-ui,sans-serif}
.sg-tag{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#fff;border:2px solid #3a2410;border-radius:9px;font:700 10.5px/14px Fredoka,system-ui,sans-serif;color:#3a2410;padding:0 5px}
.sg-prog{text-align:center;cursor:pointer;margin-top:4px}
.sg-bar{position:relative;height:30px;border-radius:16px;background:#26324f;border:3px solid #8a4b05;overflow:hidden;box-shadow:0 3px 0 #8a4b05}

.sg-bar span{position:relative;color:#fff;font-size:17px;line-height:24px;-webkit-text-stroke:1px #0b2a4a;paint-order:stroke fill}

.sg-act{display:grid;grid-template-columns:62px 1fr 62px;gap:10px;align-items:center;margin-top:4px}
.sg-go{min-height:76px;border-radius:22px;background:linear-gradient(#ff6a4a,#e5302a);border:4px solid #7a1208;box-shadow:inset 0 5px 0 #ff9a80,0 8px 0 #7a1208;color:#fff;cursor:pointer;padding:6px 8px;font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center}
.sg-go b{font-size:28px;line-height:1.05;-webkit-text-stroke:1.4px #7a1208;paint-order:stroke fill}
.sg-go small{font-weight:700;font-size:11.5px;color:#ffe0d8;margin-top:2px}
.sg-go:active{transform:translateY(6px);box-shadow:inset 0 5px 0 #ff9a80,0 2px 0 #7a1208}
.sg-egg,.sg-tro{border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font:inherit}
.sg-egg span{width:46px;height:58px;border-radius:50% 50% 48% 48%/60% 60% 40% 40%;background:radial-gradient(circle at 35% 30%,#fff7df,#f7c66c 60%,#e09a2d);border:3px solid #8a4b05;opacity:.55;filter:grayscale(.5)}
.sg-egg.on span{opacity:1;filter:none;animation:sgWob 1.6s ease-in-out infinite}
.sg-tro span{font-size:44px;line-height:54px}
.sg-egg small,.sg-tro small{background:#fff;border:2px solid #3a2410;border-radius:9px;font-weight:700;font-size:10px;color:#3a2410;padding:0 5px;white-space:nowrap}
@keyframes sgWob{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg)}40%{transform:rotate(7deg)}60%{transform:rotate(-4deg)}}
@keyframes sgBounce{0%{transform:scale(.3)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
/* celebrations */
.sg-pop{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:400;padding:6px 16px;border-radius:20px;background:linear-gradient(#ffe066,#f2a10f);border:3px solid #8a4b05;color:#fff;font:22px "Lilita One",Fredoka,sans-serif;-webkit-text-stroke:1px #6b3a10;paint-order:stroke fill;animation:sgPop 1.5s ease-out forwards;pointer-events:none}
@keyframes sgPop{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}15%{opacity:1;transform:translate(-50%,0) scale(1.1)}70%{opacity:1;transform:translate(-50%,-14px) scale(1)}100%{opacity:0;transform:translate(-50%,-34px)}}
.sg-over{position:fixed;inset:0;z-index:390;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(15,40,80,.35);animation:sgFade .25s;cursor:pointer}
.sg-over>b{font:34px "Lilita One",Fredoka,sans-serif;color:#ffd23f;-webkit-text-stroke:2px #7a3d06;paint-order:stroke fill;text-shadow:0 3px 0 #7a3d06;animation:sgBounce .6s}
.sg-over>small{font-weight:700;color:#fff;font-size:15px;text-shadow:0 1px 3px #000}
@keyframes sgFade{from{opacity:0}}
.sg-hegg{position:relative;width:110px;height:130px}
.sg-hegg i{position:absolute;left:0;right:0;background:radial-gradient(circle at 35% 30%,#fff7df,#f7c66c 60%,#e09a2d);border:4px solid #8a4b05}
.sg-hegg .t{top:0;height:62px;border-radius:55px 55px 0 0;border-bottom:0;clip-path:polygon(0 0,100% 0,100% 85%,85% 100%,70% 80%,55% 100%,40% 80%,25% 100%,10% 80%,0 95%);animation:sgLid 1.4s .35s forwards}
.sg-hegg .b{bottom:0;height:72px;border-radius:0 0 50px 50px;border-top:0}
.sg-baby{position:absolute;left:50%;top:40px;transform:translateX(-50%) scale(0);animation:sgBaby .6s .9s forwards}
@keyframes sgLid{30%{transform:rotate(-12deg)}100%{transform:translate(-60px,-90px) rotate(-70deg);opacity:0}}
@keyframes sgBaby{to{transform:translate(-50%,-30px) scale(1)}}
.sg-over.hop{justify-content:flex-end;padding-bottom:30vh}
.sg-over.hop span{position:absolute;bottom:30vh;animation:sgHop .55s ease-in-out 3 alternate}
.sg-over.hop>b{position:absolute;top:30vh}
@keyframes sgHop{from{transform:translateY(0)}to{transform:translateY(-70px) rotate(-10deg)}}
.sg-chest{position:relative;width:120px;height:110px}
.sg-chest .box{position:absolute;bottom:0;left:0;right:0;height:62px;background:linear-gradient(#b5702e,#7b4a24);border:4px solid #4a280c;border-radius:8px 8px 14px 14px;box-shadow:inset 0 0 0 6px #f3a614}
.sg-chest .lid{position:absolute;top:8px;left:0;right:0;height:40px;background:linear-gradient(#c98a4b,#8a5528);border:4px solid #4a280c;border-radius:40px 40px 6px 6px;transform-origin:10% 100%;animation:sgOpen .6s .4s forwards}
.sg-chest span{position:absolute;left:50%;top:40px;font-size:46px;transform:translateX(-50%) scale(0);animation:sgBaby .5s .8s forwards}
